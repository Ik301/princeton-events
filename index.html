<title>Princeton Events</title>
<style>
  :root{
    --bg:#0f1115; --card:#161a22; --card2:#1c2130; --line:#2a3040;
    --fg:#e8eaf0; --muted:#98a2b3; --accent:#e77500;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;

  h1{margin:0 0 2px;font-size:20px;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
    font-size:12.5px;user-select:none;transition:.12s}
  .chip.on{color:var(--fg);background:var(--card2);border-color:var(--dot)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--dot);opacity:.35}
  .chip.on .dot{opacity:1}
  .chip .n{color:var(--muted);font-size:11.5px}
  .seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);color:var(--muted);border:0;padding:6px 13px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--card2);color:var(--fg)}
  main{padding:16px 22px 44px}
  .monthnav{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .monthnav b{font-size:15.5px}
  .monthnav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:0 4px 4px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:6px 6px 7px}

  .ev .tm{color:var(--muted);font-size:10.5px;display:block}

    padding:12px 14px;margin-bottom:12px}

  .list .body{flex:1;min-width:0}

  .list .meta{color:var(--muted);font-size:12px;margin-top:2px}

    border:1px solid var(--dot);color:var(--dot)}
  .list .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .src.reg{text-decoration:none;border-color:var(--muted);color:var(--muted);cursor:pointer}
  .src.reg:hover{border-color:var(--accent);color:var(--accent)}
  .list .desc{color:var(--muted);font-size:12px;margin-top:4px}

  .weeknav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .wkwrap{overflow-x:auto}
  .wk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .wkhead{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkhead div{padding:7px 8px;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
  .wkhead div:first-child{border-left:0}
  .wkhead .today{color:var(--accent);font-weight:600}
  .wkhead .more{margin-left:5px;font-size:10px;color:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:0 5px;cursor:help}
  .wkallday{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkallday .lab{padding:5px 8px;font-size:10.5px;color:var(--muted)}
  .wkallday .cell{border-left:1px solid var(--line);padding:4px 3px;min-height:28px}
  .wkad{display:block;text-decoration:none;color:var(--fg);background:var(--card2);border-left:3px solid var(--dot);
    border-radius:4px;padding:1px 5px;font-size:10.5px;margin-bottom:3px;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis}
  .wkad:hover{background:#232a3b}
  .wkscroll{display:grid;grid-template-columns:52px repeat(7,1fr)}
  .wkgut{position:relative}
  .wkhr{position:absolute;right:6px;transform:translateY(-6px);font-size:10.5px;color:var(--muted)}
  .wkday{position:relative;border-left:1px solid var(--line)}
  .wkline{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.06)}
  .wkev{position:absolute;display:block;text-decoration:none;color:var(--fg);background:var(--card2);
    border-left:3px solid var(--dot);border-radius:5px;padding:2px 5px;font-size:10.8px;line-height:1.3;
    overflow:hidden}
  .wkev:hover{background:#232a3b}
  .wkev .t{color:var(--muted);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:760px){ .wk{min-width:620px} .wkhead div{padding:6px 4px;font-size:11px} }
  .empty{color:var(--muted);padding:28px 4px}
  footer{color:var(--muted);font-size:11.5px;padding:0 22px 26px}
  @media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} .dow{display:none}
    .list .time{flex-basis:78px} }
</style>
</head>

cluded. No experienc"}, {"title": "Thornton Tomasetti x Guy Nordenson and Associates x ASCE Info Session", "source": "careers", "start": "2026-10-28T12:00:00-04:00", "end": "2026-10-28T13:30:00-04:00", "allday": false, "location": "Engineering QUAD E219", "category": "", "url": "https://careerdevelopment.princeton.edu/events/thornton-tomasetti-x-guy-nordenson-and-associates-x-asce-info-session", "register": "https://princeton.joinhandshake.com/edu/events/2049509/overview", "audience": "", "description": "Thornton Tomasetti and Guy Nordenson and Associates - two well-renowned firms in the field of civil engineering - are visiting the Princeton University campus on Wednesday October 28 at 12 p.m. to hold an information session in collaboration with the Princeton ASCE student chapter. Engineers from both firms will share insights into their work, highlighting notable projects, their approaches to eng"}, {"title": "Wednesday Seminar Series, Mossavar-Rahmani Center for Iran & Persian Gulf Studies", "source": "university", "start": "2026-10-28T12:00:00-04:00", "end": "2026-10-28T13:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/wednesday-seminar-series-mossavar-rahmani-center-iran-persian-gulf-studies-8", "register": "", "audience": "", "description": "The Mossavar-Rahmini Center for Iran and Persian Gulf Studies invites a scholar to speak on their area of study. Topics relate to Iran and the Persian Gulf area while employing an interdisciplinary lens. To view the details of upcoming seminar topics, please visit iran.princeton.edu/events."}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-28T14:00:00-04:00", "end": "2026-10-28T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/ joinhandshake.com/edu/events/2045564", "audience": "", "description": "Learn about the wide range of education careers that alumni have pursued, from teaching to policy, nonprofit work and beyond. You will learn about careers in education that may be a good fit for you as well as relevant graduate programs. This program is for students considering education as a primary focus or interested in exploring career options. It is co-sponsored by Princeton Education Society"}, {"title": "InterVarsity Small Group", "source": "university", "start": "2026-10-28T16:30:00-04:00", "end": "2026-10-28T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/intervarsity-small-group-4", "register": "", "audience": "", "description": "Boba Chats is a safe space to explore faith in Jesus no matter your faith background. We will be studying through 1 John!"}, {"title": "Finding English Career Opportunities in Japan", "source": "university", "start": "2026-10-28T16:30:00-04:00", "end": "2026-10-28T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/finding-english-career-opportunities-japan", "register": "", "audience": "", "description": "Representatives from Jelper Club will introduce internship opportunities in Japan for English speakers. This information session is for students interested in gaining professional experience in Japan."}, {"title": "Roundtable on German Elections", "source": "university", "start": "2026-10-28T16:30:00-04:00", "end": "2026-10-28T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/roundtable-german-elections", "register": "", "audience": "", "description": "Regional elections in the east of Germany have shocked the German political system, and raised doubts about the survivability of the current government and the centrist coalition that constitutes its support. Is there a return t ience": "", "description": "Meet members of the Two Sigma Quant Research team. Alumni Quant Researchers will be there to discuss their transition from academia into financial sciences. Learn about the Internship and Early Careers program for Quant Research and what to expect during the application and interview process. Students will have the opportunity to discuss their research interests, challenges and how to apply resear"}, {"title": "Birding Society Migration Meeting", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/birding-society-migration-meeting", "register": "", "audience": "", "description": "Join the Princeton Birding Society to learn about migration and how birds move across our landscape!"}, {"title": "Musicology Colloquium with Lydia Goehr", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/musicology-colloquium-lydia-goehr", "register": "", "audience": "", "description": "The Musicology Colloquium presents a talk by Lydia Goehr.Abstract From extended metaphors, we get the wit of extension: e-wit. Extension cords, like extended chords, may be elastic or exact in reaching a breaking point. Extended tonalities, extended techniques, and extended play: each stretches a norm without quite breaking it – until it does. This lecture seeks the e-wit on display in the Metropo"}, {"title": "Seminar: \"A Field Guide to Watersheds: Division and Unity\" by Eliza Griswold", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/seminar-field-guide-watersheds-division-and-unity-eliza-griswold", "register": "", "audience": "", "description": "Eliza G  more fragile than ever. At this delicate moment, artificial intelligence has burst onto the scene—a powerful technology that holds as much potential to bolster democracy as to harm it. Yet we no longer treat democracy as a design challenge we can solve. We have built extraordinary tools without yet using them where they are needed mo"}, {"title": "Vaults of Trade: Medieval Architectures of Exchange between Sea and City", "source": "university", "start": "2026-11-12T16:30:00-05:00", "end": "2026-11-12T17:30:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/vaults-trade-medieval-architectures-exchange-between-sea-and-city", "register": "", "audience": "", "description": "Lecture"}, {"title": "Friends of PUL Small Talk: Tsundoku: What isn't in \"The Art of Japanese Publishing\" Exhibition", "source": "university", "start": "2026-11-12T17:00:00-05:00", "end": "2026-11-12T18:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/friends-pul-small-talk-tsundoku-what-isnt-art-japanese-publishing-exhibition", "register": "", "audience": "", "description": "Join us on Thursday, November 12 for a Friends Small Talk and showcase featuring Nicole Fabricand-Person '76, *01. You may have heard of the Japanese term, “tsundoku” that has become fashionable in English to describe the phenomenon of purchasing books and letting them pile up without being read. Taking liberty with the term, this Small Talk will introduce some of the wonderful books in the Marqua"}, {"title": "CITP Special Event: Book Talk with Beth Noveck", "source": "university", "start": "2026-11-12T18:00:00-05:00", "end": "2026-11-12T19:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/citp-special-event-book-talk-beth-noveck-0", "register": "", "audience": "", "description": "Democracy is in retreat at home and abroad. Our institutions are more fragile than ever. At this delicate moment, artificial intelligence has burst onto the scene—a powerful technology that holds as much potential to bolster democracy as to harm it. Yet we no longer treat democracy as a design challenge we can solve. We have built extraordinary tools without yet using them where they are needed mo"}, {"title": "Nemanja Radulović, Violin; Double Sens Ensemble (Princeton University Concerts)", "source": "university", "start": "2026-11-12T19:30:00-05:00", "end": "2026-11-12T20:30:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/nemanja-radulovic-violin-double-sens-ensemble-princeton-university-concerts", "register": "", "audience": "", "description": "Serbian-French violinist Nemanja Radulović is as close to a rock star as classical music gets—fearless, electrifying, and utterly captivating. He makes his long-awaited Princeton debut with his sparkling Double Sens Chamber Orchestra, an ensemble he founded with his closest Serbian and French friends. Crowned “International Revelation of the Year” at the Victoires de la Musique and winner of the 2"}, {"title": "Site: Exhibition by Carlos Agredano", "source": "university", "start": "2026-11-13T10:00:00-05:00", "end": "2026-11-13T11:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/site-exhibition-carlos-agredano-2", "register": "", "audience": "", "description": "Recent 2025-26 Hodder Fellow Carlos Agredano showcases new work in the exhibition, Site, in the Hurley Gallery at the Lewis Arts complex.Site follows the history of the chemical industry in twentieth-century New Jersey, whose factories supplied pesticides, plastics, and munitions to American border enforcement and the United States military. Networks of industrial firms ran from Perth Amboy, Princ"}, {"title": "The Aging Prison Population: Causes, Consequences and Solutions", "source": "university", "start": "2026-11-13T11 y": "", "url": "https://www.princeton.edu/events/2026/pop-talk-curator-kit-brooks", "register": "", "audience": "", "description": "Short talks and Q&As on Museum topics This month, Kit Brooks, the Museum's curator of Asian art, will discuss the special exhibition \"Takeda Hideo’s Genpei: Defying Authority,\" which features a series of silkscreen prints that cynically reinterprets Japan’s Genpei War (1180–85) within the context of twentieth-century social upheavals. After the talk, head upstairs to the Allen Adler and Frances Be"}, {"title": "Fund for Irish Studies: Lecture by Peter Kelly — “Seamus Heaney and the Classics”", "source": "university", "start": "2026-11-13T16:30:00-05:00", "end": "2026-11-13T17:30:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/fund-irish-studies-lecture-peter-kelly-seamus-heaney-and-classics", "register": "", "audience": "", "description": "Princeton Assistant Professor of Classics Peter Kelly presents a lecture on “Seamus Heaney and the Classics,” sharing material from his current book project on connections between the poetry of Seamus Heaney, Michael Longley and Derek Mahon and the Greco-Roman classics. For these Northern Irish writers, the translation and reception of Latin literature became a means of operating inside, outside, "}, {"title": "Men's Ice Hockey vs Harvard", "source": "university", "start": "2026-11-13T19:00:00-05:00", "end": "2026-11-13T20:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/mens-ice-hockey-vs-harvard", "register": "", "audience": "", "description": "Men's Ice Hockey vs Harvard"}, {"title": "At the Wedding by Bryna Turner", "source": "university", "start": "2026-11-13T20:00:00-05:00", "end": "2026-11-13T21:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/wedding-bryna-turner", "register": "", "audience": "", "description": "Pixl const SRC = Object.fromEntries(DATA.sources.map(s => [s.key, s]));
const EV = DATA.events.map(e => ({...e, d: new Date(e.start), e2: new Date(e.end)}));
const on = new Set(DATA.sources.map(s => s.key));
const chips = document.getElementById('chips');
DATA.sources.forEach(s => {
  const c = document.createElement('button');
  c.className = 'chip on'; c.style.setProperty('--dot', s.color);
  const n = EV.filter(e => e.source === s.key).length;
  c.innerHTML = `<span class="dot"></span>${s.label}<span class="n">${n}</span>`;
  c.onclick = () => { c.classList.toggle('on'); on.has(s.key) ? on.delete(s.key) : on.add(s.key); render(); };
  chips.appendChild(c);
});
const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
document.getElementById('dows').innerHTML = dows.map(d => `<div class="dow">${d}</div>`).join('');
const PARAMS = new URLSearchParams(location.search);
let view = ['month','week','list'].includes(PARAMS.get('view')) ? PARAMS.get('view') : 'month';
let cursor = PARAMS.get('date') ? new Date(PARAMS.get('date') + 'T12:00:00') : new Date(Date.now());
const fmtT = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(':00','');
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const vis = () => EV.filter(e => on.has(e.source));
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const col = e => (SRC[e.source] ? SRC[e.source].color : '#888');
const fmtHour = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');
const overlapsDay = (e, d) => {
  const a = new Date(e.d.getFullYear(), e.d.getMonth(), e.d.getDate());
  const b = new Date(e.e2.getFullYear(), e.e2.getMonth(), e.e2.getDate());
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return t >= a && t <= (e.allday ? new Date(b - 86400000) : b);
};

function render(){
  const ev = vis();
  document.getElementById('sub').textContent =
    `${ev.length} upcoming events · ${DATA.sources.length} sources · refreshed ${DATA.generated_label}`;
  document.getElementById('foot').textContent =
    'Scraped from chapel / career development / campus rec / university events. Toggles filter this page only.';
  for (const v of ['month','week','list'])
    document.getElementById(v).style.display = view === v ? '' : 'none';
  document.getElementById('bMonth').className = view === 'month' ? 'on' : '';
  document.getElementById('bWeek').className = view === 'week' ? 'on' : '';
  document.getElementById('bList').className = view === 'list' ? 'on' : '';
  if (view === 'month') renderMonth(ev);
  else if (view === 'week') renderWeek(ev);
  else renderList(ev);
}
function renderMonth(ev){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('mtitle').textContent =
    cursor.toLocaleDateString([], {month:'long', year:'numeric'});
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = new Date(); let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dayEv = ev.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    const cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (sameDay(d, today) ? ' today' : '');
    html += `<div class="${cls}"><div class="dnum"><span>${d.getDate()}</span></div>`;
    dayEv.slice(0,4).forEach(e => {
      html += `<a class="ev${e.allday?' all':''}" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">
        <span class="tm">${e.allday ? 'all day' : fmtT(e.d)}</span>${esc(e.title.slice(0,58))}</a>`;
    });
    if (dayEv.length > 4) html += `<div class="tm" style="color:var(--muted);font-size:10.5px">+${dayEv.length-4} more</div>`;
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}
function renderWeek(ev){
  const MAXLANES = 3;
  const ws = new Date(cursor); ws.setDate(ws.getDate() - ws.getDay()); ws.setHours(0,0,0,0);
  const days = []; for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const we = new Date(days[6]); we.setHours(23,59,59,999);
  document.getElementById('wtitle').textContent =
    days[0].toLocaleDateString([], {month:'long', day:'numeric'}) + ' to ' +
    days[6].toLocaleDateString([], {month:'long', day:'numeric', year:'numeric'});

  const week = ev.filter(e => e.d <= we && e.e2 >= days[0]);
  const ad = week.filter(e => e.allday);
  const timed = week.filter(e => !e.allday);
  const today = new Date();

  // hour window: fit the week's events, but keep a sane minimum span
  let h0 = 9, h1 = 20;
  timed.forEach(e => {
    h0 = Math.min(h0, Math.floor(e.d.getHours() + e.d.getMinutes() / 60));
    const endH = sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24;
    h1 = Math.max(h1, Math.ceil(endH));
  });
  h0 = Math.max(0, Math.min(h0, 8));
  h1 = Math.min(24, Math.max(h1, 18));
  const PX = 42, H = (h1 - h0) * PX;

  // pass 1: place each day's timed events into lanes, capped so columns stay readable
  const perDay = days.map(d => {
    const items = timed.filter(e => sameDay(e.d, d)).sort((a,b) => a.d - b.d);
    const laneEnds = [];
    const all = items.map(e => {
      const s = e.d.getHours() + e.d.getMinutes() / 60;
      const en = Math.max(s + 0.25, sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24);
      let lane = laneEnds.findIndex(t => t <= s);
      if (lane === -1){ lane = laneEnds.length; laneEnds.push(en); } else laneEnds[lane] = en;
      return {e, s, en, lane};
    });
    const visible = all.filter(p => p.lane < MAXLANES);
    const hidden = all.filter(p => p.lane >= MAXLANES);
    const lanes = Math.max(1, Math.min(MAXLANES, laneEnds.length));
    return {d, visible, hidden, lanes};
  });

  // pass 2: render
  document.getElementById('wkHead').innerHTML = '<div>Time</div>' + perDay.map(({d, hidden}) =>
    `<div class="${sameDay(d, today) ? 'today' : ''}">${d.toLocaleDateString([], {weekday:'short'})}
      <b>${d.getDate()}</b>${hidden.length
        ? `<span class="more" title="${esc(hidden.slice(0,8).map(h => h.e.title).join(' | '))}">+${hidden.length}</span>`
        : ''}</div>`).join('');

  document.getElementById('wkAllday').innerHTML = '<div class="lab">all day</div>' + days.map(d => {
    const items = ad.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    return '<div class="cell">' + items.map(e =>
      `<a class="wkad" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">${esc(e.title.slice(0,30))}</a>`
    ).join('') + '</div>';
  }).join('');

  let gut = '';
  for (let h = h0; h <= h1; h++) gut += `<div class="wkhr" style="top:${(h - h0) * PX}px">${fmtHour(h)}</div>`;
  let lines = '';
  for (let h = h0 + 1; h < h1; h++) lines += `<div class="wkline" style="top:${(h - h0) * PX}px"></div>`;

  document.getElementById('wkScroll').innerHTML =
    `<div class="wkgut" style="height:${H}px">${gut}</div>` +
    perDay.map(({visible, lanes}) => {
      const w = 100 / lanes;
      const blocks = visible.map(p => {
        const top = (p.s - h0) * PX, hh = Math.max(22, (Math.min(p.en, h1) - p.s) * PX - 3);
        const det = [p.e.location, p.e.audience].filter(Boolean).join(' · ');
        const span = (lanes === 1 && sameDay(p.e.d, p.e.e2)) ? ' to ' + fmtT(p.e.e2) : '';
        return `<a class="wkev" href="${p.e.url}" target="_blank" style="--dot:${col(p.e)};top:${top}px;height:${hh}px;
          left:calc(${p.lane * w}% + 2px);width:calc(${w}% - 4px)" title="${esc(p.e.title)}${det ? ' · ' + esc(det) : ''}">
          <span class="t">${fmtT(p.e.d)}${span}</span>
          <b>${esc(p.e.title.slice(0,70))}</b>
          ${hh >= 46 && p.e.location ? `<span class="t">${esc(p.e.location.slice(0,40))}</span>` : ''}</a>`;
      }).join('');
      return `<div class="wkday" style="height:${H}px">${lines}${blocks}</div>`;
    }).join('');
}
function renderList(ev){
  const groups = {};
  ev.forEach(e => { const k = e.d.toDateString(); (groups[k] = groups[k] || []).push(e); });
  const keys = Object.keys(groups).sort((a,b) => new Date(a) - new Date(b)).slice(0, 45);
  if (!keys.length){ document.getElementById('list').innerHTML = '<div class="empty">Nothing ahead for the selected sources.</div>'; return; }
  document.getElementById('list').innerHTML = keys.map(k => {
    const d = new Date(k);
    const rows = groups[k].sort((a,b) => a.d - b.d).map(e => {
      const col = SRC[e.source] ? SRC[e.source].color : '#888';
      const lbl = SRC[e.source] ? SRC[e.source].label : e.source;
      const time = e.allday ? 'All day' : fmtT(e.d) + (e.end !== e.start ? ' – ' + fmtT(e.e2) : '');
      const meta = [e.location, e.audience].filter(Boolean).join(' · ');
      const desc = (e.description || '').slice(0, 190);
      return `<div class="row"><div class="time">${time}</div><div class="body">
        <a href="${e.url}" target="_blank">${e.title}</a>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${desc ? `<div class="desc">${desc}${(e.description || '').length > 190 ? '…' : ''}</div>` : ''}
        <div class="chips"><span class="src" style="--dot:${col}">${lbl}</span>
          <a class="src reg" href="${e.url}" target="_blank">event page</a>
          ${e.register ? `<a class="src reg" href="${e.register}" target="_blank">register</a>` : ''}
        </div>
      </div></div>`;
    }).join('');
    return `<div class="daygroup"><h3>${d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})}</h3>${rows}</div>`;
  }).join('');
}
document.getElementById('prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
document.getElementById('next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };
document.getElementById('today').onclick = () => { cursor = new Date(); render(); };
document.getElementById('bMonth').onclick = () => { view = 'month'; render(); };
document.getElementById('bWeek').onclick = () => { view = 'week'; render(); };
document.getElementById('bList').onclick = () => { view = 'list'; render(); };
document.getElementById('wprev').onclick = () => { cursor.setDate(cursor.getDate() - 7); render(); };
document.getElementById('wnext').onclick = () => { cursor.setDate(cursor.getDate() + 7); render(); };
document.getElementById('wtoday').onclick = () => { cursor = new Date(); render(); };
render();
</script>
