<title>Princeton Events</title>
<style>
  :root{
    --bg:#0f1115; --card:#161a22; --card2:#1c2130; --line:#2a3040;
    --fg:#e8eaf0; --muted:#98a2b3; --accent:#e77500;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(15,17,21,.96);backdrop-filter:blur(6px);z-index:5}
  h1{margin:0 0 2px;font-size:20px;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
    font-size:12.5px;user-select:none;transition:.12s}
  .chip.on{color:var(--fg);background:var(--card2);border-color:var(--dot)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--dot);opacity:.35}
  .chip.on .dot{opacity:1}
  .chip .n{color:var(--muted);font-size:11.5px}
  .seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);color:var(--muted);border:0;padding:6px 13px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--card2);color:var(--fg)}
  main{padding:16px 22px 44px}
  .monthnav{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .monthnav b{font-size:15.5px}
  .monthnav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:0 4px 4px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:6px 6px 7px}
  .day.out{opacity:.42}
  .day.today{border-color:var(--accent)}
  .dnum{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
  .day.today .dnum{color:var(--accent);font-weight:600}
  .ev{display:block;text-decoration:none;color:var(--fg);background:var(--card2);
    border-left:3px solid var(--dot);border-radius:5px;padding:3px 6px;margin-bottom:4px;font-size:11.5px}
  .ev:hover{background:#232a3b}
  .ev .tm{color:var(--muted);font-size:10.5px;display:block}
  .ev.all .tm{color:var(--dot)}
  .list .daygroup{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:12px}
  .list .daygroup h3{margin:0 0 9px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.7px}
  .list .row{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .list .row:first-of-type{border-top:0}
  .list .time{flex:0 0 108px;color:var(--muted);font-size:12.5px;padding-top:1px}
  .list .body{flex:1;min-width:0}
  .list a{color:var(--fg);text-decoration:none}
  .list a:hover{color:var(--accent)}
  .list .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .src{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;margin-top:4px;
    border:1px solid var(--dot);color:var(--dot)}
  .list .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .src.reg{text-decoration:none;border-color:var(--muted);color:var(--muted);cursor:pointer}
  .src.reg:hover{border-color:var(--accent);color:var(--accent)}
  .list .desc{color:var(--muted);font-size:12px;margin-top:4px}
  .weeknav{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .weeknav b{font-size:15.5px}
  .weeknav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .wkwrap{overflow-x:auto}
  .wk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .wkhead{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkhead div{padding:7px 8px;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
  .wkhead div:first-child{border-left:0}
  .wkhead .today{color:var(--accent);font-weight:600}
  .wkhead .more{margin-left:5px;font-size:10px;color:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:0 5px;cursor:help}
  .wkallday{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkallday .lab{padding:5px 8px;font-size:10.5px;color:var(--muted)}
  .wkallday .cell{border-left:1px solid var(--line);padding:4px 3px;min-height:28px}
  .wkad{display:block;text-decoration:none;color:var(--fg);background:var(--card2);border-left:3px solid var(--dot);
    border-radius:4px;padding:1px 5px;font-size:10.5px;margin-bottom:3px;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis}
  .wkad:hover{background:#232a3b}
  .wkscroll{display:grid;grid-template-columns:52px repeat(7,1fr)}
  .wkgut{position:relative}
  .wkhr{position:absolute;right:6px;transform:translateY(-6px);font-size:10.5px;color:var(--muted)}
  .wkday{position:relative;border-left:1px solid var(--line)}
  .wkline{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.06)}
  .wkev{position:absolute;display:block;text-decoration:none;color:var(--fg);background:var(--card2);
    border-left:3px solid var(--dot);border-radius:5px;padding:2px 5px;font-size:10.8px;line-height:1.3;
    overflow:hidden}
  .wkev:hover{background:#232a3b}
  .wkev .t{color:var(--muted);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:760px){ .wk{min-width:620px} .wkhead div{padding:6px 4px;font-size:11px} }
  .empty{color:var(--muted);padding:28px 4px}
  footer{color:var(--muted);font-size:11.5px;padding:0 22px 26px}
  @media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} .dow{display:none}
    .list .time{flex-basis:78px} }
</style>
</head>

pt to process data. The session w"}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-01T14:00:00-04:00", "end": "2026-10-01T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "Georgetown Law School Virtual Info Session", "source": "careers", "start": "2026-10-01T15:00:00-04:00", "end": "2026-10-01T16:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://careerdevelopment.princeton.edu/events/georgetown-law-school-virtual-info-session", "register": "https://princeton.joinhandshake.com/edu/events/1995693", "audience": "Graduate Students, Undergraduate Students", "description": "Join Georgetown Law Center’s (GULC) admission representative as they share in-depth information about GULC and what current and future applicants should consider when applying. This is an opportunity to learn about GULC clinics, curriculum and admission criteria. You must also register through GULC (https://georgetown.zoom.us/meeting/register/EZWfN9CTRUquFEuCfP-0iw#/registration) and you will rece"}, {"title": "2026 Bruce Blair Memorial Lecture", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "locatio earch that may interest them for their future independent work. Additionally this event will offer department members the opportunity to engage in mentorship and/or identify prospective RAs for their labs. Dinner will be provi"}, {"title": "Performance and Contradiction: Acting Natural", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Art Museum, 134 Small Auditorium", "category": "", "url": "https://www.princeton.edu/events/2026/performance-and-contradiction-acting-natural", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "In the 1970s, performance gained widespread purchase as a discrete artistic category and lens of scholarly analysis in the United States. At the same time, its discourses were mired in irresolution. This talk argues that these twinned phenomena issue from performance’s formal capacity to register contradictions at the level of political economy. I take artists as among the first and best theorists"}, {"title": "The Keeper of My Kin, Ada Ferrer", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Chancellor Green, 101 Rotunda", "category": "", "url": "https://www.princeton.edu/events/2026/keeper-my-kin-ada-ferrer", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students", "description": "A book reading and conversation from Pulitzer Prize–winning author Ada Ferrer on her latest memoir. A memoir about migration, separation, and the love of one family forcing its way through the fissures of history. Professor Ferrer’s Pulitzer Prize-winning book Cuba: An American History (Scribner, 2021) is a sweeping history of more than five hundred years of Cuban history, written in rousing and a"}, {"title": "Composition Colloquium with Nico Muhly", "source": "university", "start": "2026-10-  from 10:30 AM-12 noon, followed by a networking lunch from 12 noon - 1 PM. Arts at Work ill"}, {"title": "Tour of Marquand Library", "source": "university", "start": "2026-10-07T11:00:00-04:00", "end": "2026-10-07T12:00:00-04:00", "allday": false, "location": "Marquand Art Library, Marquand Art Library", "category": "", "url": "https://www.princeton.edu/events/2026/tour-marquand-library-4", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Marquand Library, founded in 1908, is one of the finest art libraries in North America. Marquand re-opened within the new Art Museum complex after an almost five-year hiatus in January 2026. Tours of the five-floor non-circulating library will be led by Rebecca Friedman, Art Librarian for Research Services, who has worked at Marquand since 2007. Be our guest where you'll learn more about the build"}, {"title": "Crafternoon at the Commons: Paper Silhouette", "source": "university", "start": "2026-10-07T11:45:00-04:00", "end": "2026-10-07T12:45:00-04:00", "allday": false, "location": "Commons Library Curiosity Studio, Commons Library", "category": "", "url": "https://www.princeton.edu/events/2026/crafternoon-commons-paper-silhouette", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Crafternoons are designed to give you a short break to kick off your week and make something with your hands. Our workshops are low-stakes with easy-to-learn crafts designed to give you a fun finished product. During this workshop you will learn about the history of the paper silhouette as well as several modern-day techniques for creating your own. You will leave the workshop having cut your own "}, {"title": "The Trafalgar Squeeze of Global Liquidity", "source": "university", "start": "2026-10-07T12:00:00-04:00", "end": "2026-10-07T13:00:00-04:00", "allday": false, "location": "Julis Romo Rabinowitz Building, 301", "category": "", "url": "https://www.princeton.edu/events/2026/trafalgar-squeeze-global-liquidity", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "The severity of financial crises is exacerbated by the lack of international liquidity or the absence of a global lender of last resort. This was evident during the Long Depression (1873–1896), the Great Depression (1929–1936), and, as we show in this paper, during the 1805–1806 crisis that followed the Battle of Trafalgar. The latter took Atlantic trade routes away from Spain and cut off Europe's"}, {"title": "Using Tools to Create Models in QGIS", "source": "university", "start": "2026-10-07T13:30:00-04:00", "end": "2026-10-07T14:30:00-04:00", "allday": false, "location": "Lewis Library - Computer Classroom (225), Lewis Science Library", "category": "", "url": "https://www.princeton.edu/events/2026/using-tools-create-models-qgis-0", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "GIS users often want to run a process multiple times, changing the inputs, parameters, or summaries generated. QGIS has many ways to help users automate processes. The exercises show users how to use graphic tools in the Processing window, how to run models iteratively, and how to extract commands for use in Python scripts. Students will use QGIS on classroom Windows computers. This event is part "}, {"title": "McGraw Undergraduate Learning Program - Learning Concierge", "source": "university", "start": "2026-10-07T15:00:00-04:00", "end": "2026-10-07T16:00:00-04:00", "allday": false, "location": "Frist Campus Center, Table C3", "category": "", "url": "https://www.princeton.edu/events/2026/mcgraw-undergraduate-learning-program-learning-concierge-8", "register": "", "audience": "Open to the Public, Students", "description": "Stop by McGraw's Learning Concierge Desk in the 100-level of Frist Campus Center for all of your learning-related questions and needs. Grow wi reciating the scope of what data stewardship entails, feeling confident in how best to proceed through the research lifecycle, a"}, {"title": "Faculty and staff Bible study", "source": "university", "start": "2026-10-08T12:00:00-04:00", "end": "2026-10-08T13:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/faculty-and-staff-bible-study-1", "register": "", "audience": "", "description": "Open Bible study over lunch for Princeton staff and faculty - hosted by Princeton Christian Fellowship and Faculty Commons"}, {"title": "After Noon Concert Series", "source": "chapel", "start": "2026-10-08T12:30:00-04:00", "end": "2026-10-08T13:00:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://chapel.princeton.edu/events/after-noon-concert-series-9", "register": "", "audience": "", "description": "The After Noon Concert Series is a weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. Each visiting organist rehearses and performs, bringing forth a different voice and character from the org"}, {"title": "After Noon Concert Series", "source": "university", "start": "2026-10-08T12:30:00-04:00", "end": "2026-10-08T13:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/after-noon-concert-series-4", "register": "", "audience": "", "description": "A weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. East visiting organist rehearses and performs, bringing forth a different voice and charachter of the organ."}, {"title": "Using ModelBuild , logistics, and design decisions that make ES&SEAS a sustainable building complex. Some specific feature we will explore: the hybrid structural strategy: mass timber in offices"}, {"title": "Friends of PUL: Members Reception \"The Art of Japanese Publishing\"", "source": "university", "start": "2026-10-08T16:00:00-04:00", "end": "2026-10-08T17:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/friends-pul-members-reception-art-japanese-publishing", "register": "", "audience": "", "description": "A Friends members-only reception with the curators of PUL's fall 2026 exhibition \"The Art of Japanese Publishing\" celebrating Marquand Library's collection of rare Japanese illustrated books. Exhibition curated by Nicole Fabricand-Person ’76 *01, Japanese Art Specialist, Marquand Library of Art & Archaeology and Holly Hatheway, Director, Marquand Library of Art & Archaeology. Invitations with RSVP"}, {"title": "Program in the Ancient World - Michael Nylan Talk", "source": "university", "start": "2026-10-08T16:30:00-04:00", "end": "2026-10-08T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/program-ancient-world-michael-nylan-talk", "register": "", "audience": "", "description": "It is far from easy to do either cross-chronological or cross-cultural history well. As someone engaged for nearly forty years in forging comparisons of both types, I have experienced the promise and perils, as well as the blank walls. Far too few historians think about what topics are truly comparable; at the same time, the minute we think or write or talk about another era or another culture in "}, {"title": "Fireside Chat with the CEO of Fizz", "source": "university", "start": "2026-10-08T16:30:00-04:00", "end": "2026-10-08T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/fireside-chat-ceo-fizz", "register": "", " const SRC = Object.fromEntries(DATA.sources.map(s => [s.key, s]));
const EV = DATA.events.map(e => ({...e, d: new Date(e.start), e2: new Date(e.end)}));
const on = new Set(DATA.sources.map(s => s.key));
const chips = document.getElementById('chips');
DATA.sources.forEach(s => {
  const c = document.createElement('button');
  c.className = 'chip on'; c.style.setProperty('--dot', s.color);
  const n = EV.filter(e => e.source === s.key).length;
  c.innerHTML = `<span class="dot"></span>${s.label}<span class="n">${n}</span>`;
  c.onclick = () => { c.classList.toggle('on'); on.has(s.key) ? on.delete(s.key) : on.add(s.key); render(); };
  chips.appendChild(c);
});
const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
document.getElementById('dows').innerHTML = dows.map(d => `<div class="dow">${d}</div>`).join('');
const PARAMS = new URLSearchParams(location.search);
let view = ['month','week','list'].includes(PARAMS.get('view')) ? PARAMS.get('view') : 'month';
let cursor = PARAMS.get('date') ? new Date(PARAMS.get('date') + 'T12:00:00') : new Date(Date.now());
const fmtT = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(':00','');
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const vis = () => EV.filter(e => on.has(e.source));
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const col = e => (SRC[e.source] ? SRC[e.source].color : '#888');
const fmtHour = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');
const overlapsDay = (e, d) => {
  const a = new Date(e.d.getFullYear(), e.d.getMonth(), e.d.getDate());
  const b = new Date(e.e2.getFullYear(), e.e2.getMonth(), e.e2.getDate());
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return t >= a && t <= (e.allday ? new Date(b - 86400000) : b);
};

function render(){
  const ev = vis();
  document.getElementById('sub').textContent =
    `${ev.length} upcoming events · ${DATA.sources.length} sources · refreshed ${DATA.generated_label}`;
  document.getElementById('foot').textContent =
    'Scraped from chapel / career development / campus rec / university events. Toggles filter this page only.';
  for (const v of ['month','week','list'])
    document.getElementById(v).style.display = view === v ? '' : 'none';
  document.getElementById('bMonth').className = view === 'month' ? 'on' : '';
  document.getElementById('bWeek').className = view === 'week' ? 'on' : '';
  document.getElementById('bList').className = view === 'list' ? 'on' : '';
  if (view === 'month') renderMonth(ev);
  else if (view === 'week') renderWeek(ev);
  else renderList(ev);
}
function renderMonth(ev){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('mtitle').textContent =
    cursor.toLocaleDateString([], {month:'long', year:'numeric'});
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = new Date(); let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dayEv = ev.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    const cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (sameDay(d, today) ? ' today' : '');
    html += `<div class="${cls}"><div class="dnum"><span>${d.getDate()}</span></div>`;
    dayEv.slice(0,4).forEach(e => {
      html += `<a class="ev${e.allday?' all':''}" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">
        <span class="tm">${e.allday ? 'all day' : fmtT(e.d)}</span>${esc(e.title.slice(0,58))}</a>`;
    });
    if (dayEv.length > 4) html += `<div class="tm" style="color:var(--muted);font-size:10.5px">+${dayEv.length-4} more</div>`;
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}
function renderWeek(ev){
  const MAXLANES = 3;
  const ws = new Date(cursor); ws.setDate(ws.getDate() - ws.getDay()); ws.setHours(0,0,0,0);
  const days = []; for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const we = new Date(days[6]); we.setHours(23,59,59,999);
  document.getElementById('wtitle').textContent =
    days[0].toLocaleDateString([], {month:'long', day:'numeric'}) + ' to ' +
    days[6].toLocaleDateString([], {month:'long', day:'numeric', year:'numeric'});

  const week = ev.filter(e => e.d <= we && e.e2 >= days[0]);
  const ad = week.filter(e => e.allday);
  const timed = week.filter(e => !e.allday);
  const today = new Date();

  // hour window: fit the week's events, but keep a sane minimum span
  let h0 = 9, h1 = 20;
  timed.forEach(e => {
    h0 = Math.min(h0, Math.floor(e.d.getHours() + e.d.getMinutes() / 60));
    const endH = sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24;
    h1 = Math.max(h1, Math.ceil(endH));
  });
  h0 = Math.max(0, Math.min(h0, 8));
  h1 = Math.min(24, Math.max(h1, 18));
  const PX = 42, H = (h1 - h0) * PX;

  // pass 1: place each day's timed events into lanes, capped so columns stay readable
  const perDay = days.map(d => {
    const items = timed.filter(e => sameDay(e.d, d)).sort((a,b) => a.d - b.d);
    const laneEnds = [];
    const all = items.map(e => {
      const s = e.d.getHours() + e.d.getMinutes() / 60;
      const en = Math.max(s + 0.25, sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24);
      let lane = laneEnds.findIndex(t => t <= s);
      if (lane === -1){ lane = laneEnds.length; laneEnds.push(en); } else laneEnds[lane] = en;
      return {e, s, en, lane};
    });
    const visible = all.filter(p => p.lane < MAXLANES);
    const hidden = all.filter(p => p.lane >= MAXLANES);
    const lanes = Math.max(1, Math.min(MAXLANES, laneEnds.length));
    return {d, visible, hidden, lanes};
  });

  // pass 2: render
  document.getElementById('wkHead').innerHTML = '<div>Time</div>' + perDay.map(({d, hidden}) =>
    `<div class="${sameDay(d, today) ? 'today' : ''}">${d.toLocaleDateString([], {weekday:'short'})}
      <b>${d.getDate()}</b>${hidden.length
        ? `<span class="more" title="${esc(hidden.slice(0,8).map(h => h.e.title).join(' | '))}">+${hidden.length}</span>`
        : ''}</div>`).join('');

  document.getElementById('wkAllday').innerHTML = '<div class="lab">all day</div>' + days.map(d => {
    const items = ad.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    return '<div class="cell">' + items.map(e =>
      `<a class="wkad" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">${esc(e.title.slice(0,30))}</a>`
    ).join('') + '</div>';
  }).join('');

  let gut = '';
  for (let h = h0; h <= h1; h++) gut += `<div class="wkhr" style="top:${(h - h0) * PX}px">${fmtHour(h)}</div>`;
  let lines = '';
  for (let h = h0 + 1; h < h1; h++) lines += `<div class="wkline" style="top:${(h - h0) * PX}px"></div>`;

  document.getElementById('wkScroll').innerHTML =
    `<div class="wkgut" style="height:${H}px">${gut}</div>` +
    perDay.map(({visible, lanes}) => {
      const w = 100 / lanes;
      const blocks = visible.map(p => {
        const top = (p.s - h0) * PX, hh = Math.max(22, (Math.min(p.en, h1) - p.s) * PX - 3);
        const det = [p.e.location, p.e.audience].filter(Boolean).join(' · ');
        const span = (lanes === 1 && sameDay(p.e.d, p.e.e2)) ? ' to ' + fmtT(p.e.e2) : '';
        return `<a class="wkev" href="${p.e.url}" target="_blank" style="--dot:${col(p.e)};top:${top}px;height:${hh}px;
          left:calc(${p.lane * w}% + 2px);width:calc(${w}% - 4px)" title="${esc(p.e.title)}${det ? ' · ' + esc(det) : ''}">
          <span class="t">${fmtT(p.e.d)}${span}</span>
          <b>${esc(p.e.title.slice(0,70))}</b>
          ${hh >= 46 && p.e.location ? `<span class="t">${esc(p.e.location.slice(0,40))}</span>` : ''}</a>`;
      }).join('');
      return `<div class="wkday" style="height:${H}px">${lines}${blocks}</div>`;
    }).join('');
}
function renderList(ev){
  const groups = {};
  ev.forEach(e => { const k = e.d.toDateString(); (groups[k] = groups[k] || []).push(e); });
  const keys = Object.keys(groups).sort((a,b) => new Date(a) - new Date(b)).slice(0, 45);
  if (!keys.length){ document.getElementById('list').innerHTML = '<div class="empty">Nothing ahead for the selected sources.</div>'; return; }
  document.getElementById('list').innerHTML = keys.map(k => {
    const d = new Date(k);
    const rows = groups[k].sort((a,b) => a.d - b.d).map(e => {
      const col = SRC[e.source] ? SRC[e.source].color : '#888';
      const lbl = SRC[e.source] ? SRC[e.source].label : e.source;
      const time = e.allday ? 'All day' : fmtT(e.d) + (e.end !== e.start ? ' – ' + fmtT(e.e2) : '');
      const meta = [e.location, e.audience].filter(Boolean).join(' · ');
      const desc = (e.description || '').slice(0, 190);
      return `<div class="row"><div class="time">${time}</div><div class="body">
        <a href="${e.url}" target="_blank">${e.title}</a>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${desc ? `<div class="desc">${desc}${(e.description || '').length > 190 ? '…' : ''}</div>` : ''}
        <div class="chips"><span class="src" style="--dot:${col}">${lbl}</span>
          <a class="src reg" href="${e.url}" target="_blank">event page</a>
          ${e.register ? `<a class="src reg" href="${e.register}" target="_blank">register</a>` : ''}
        </div>
      </div></div>`;
    }).join('');
    return `<div class="daygroup"><h3>${d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})}</h3>${rows}</div>`;
  }).join('');
}
document.getElementById('prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
document.getElementById('next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };
document.getElementById('today').onclick = () => { cursor = new Date(); render(); };
document.getElementById('bMonth').onclick = () => { view = 'month'; render(); };
document.getElementById('bWeek').onclick = () => { view = 'week'; render(); };
document.getElementById('bList').onclick = () => { view = 'list'; render(); };
document.getElementById('wprev').onclick = () => { cursor.setDate(cursor.getDate() - 7); render(); };
document.getElementById('wnext').onclick = () => { cursor.setDate(cursor.getDate() + 7); render(); };
document.getElementById('wtoday').onclick = () => { cursor = new Date(); render(); };
render();
</script>
