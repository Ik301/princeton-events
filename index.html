<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Princeton Events</title>
<style>
  :root{
    --bg:#0f1115; --card:#161a22; --card2:#1c2130; --line:#2a3040;
    --fg:#e8eaf0; --muted:#98a2b3; --accent:#e77500;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:rgba(15,17,21,.96);backdrop-filter:blur(6px);z-index:5}
  h1{margin:0 0 2px;font-size:20px;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;
    font-size:12.5px;user-select:none;transition:.12s}
  .chip.on{color:var(--fg);background:var(--card2);border-color:var(--dot)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--dot);opacity:.35}
  .chip.on .dot{opacity:1}
  .chip .n{color:var(--muted);font-size:11.5px}
  .seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);color:var(--muted);border:0;padding:6px 13px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--card2);color:var(--fg)}
  main{padding:16px 22px 44px}
  .monthnav{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .monthnav b{font-size:15.5px}
  .monthnav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .dow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:0 4px 4px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:6px 6px 7px}
  .day.out{opacity:.42}
  .day.today{border-color:var(--accent)}
  .dnum{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
  .day.today .dnum{color:var(--accent);font-weight:600}
  .ev{display:block;text-decoration:none;color:var(--fg);background:var(--card2);
    border-left:3px solid var(--dot);border-radius:5px;padding:3px 6px;margin-bottom:4px;font-size:11.5px}
  .ev:hover{background:#232a3b}
  .ev .tm{color:var(--muted);font-size:10.5px;display:block}
  .ev.all .tm{color:var(--dot)}
  .list .daygroup{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:12px}
  .list .daygroup h3{margin:0 0 9px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.7px}
  .list .row{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
  .list .row:first-of-type{border-top:0}
  .list .time{flex:0 0 108px;color:var(--muted);font-size:12.5px;padding-top:1px}
  .list .body{flex:1;min-width:0}
  .list a{color:var(--fg);text-decoration:none}
  .list a:hover{color:var(--accent)}
  .list .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .src{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;margin-top:4px;
    border:1px solid var(--dot);color:var(--dot)}
  .list .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .src.reg{text-decoration:none;border-color:var(--muted);color:var(--muted);cursor:pointer}
  .src.reg:hover{border-color:var(--accent);color:var(--accent)}
  .list .desc{color:var(--muted);font-size:12px;margin-top:4px}
  .weeknav{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
  .weeknav b{font-size:15.5px}
  .weeknav button{background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:4px 11px;cursor:pointer}
  .wkwrap{overflow-x:auto}
  .wk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .wkhead{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkhead div{padding:7px 8px;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
  .wkhead div:first-child{border-left:0}
  .wkhead .today{color:var(--accent);font-weight:600}
  .wkhead .more{margin-left:5px;font-size:10px;color:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:0 5px;cursor:help}
  .wkallday{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line)}
  .wkallday .lab{padding:5px 8px;font-size:10.5px;color:var(--muted)}
  .wkallday .cell{border-left:1px solid var(--line);padding:4px 3px;min-height:28px}
  .wkad{display:block;text-decoration:none;color:var(--fg);background:var(--card2);border-left:3px solid var(--dot);
    border-radius:4px;padding:1px 5px;font-size:10.5px;margin-bottom:3px;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis}
  .wkad:hover{background:#232a3b}
  .wkscroll{display:grid;grid-template-columns:52px repeat(7,1fr)}
  .wkgut{position:relative}
  .wkhr{position:absolute;right:6px;transform:translateY(-6px);font-size:10.5px;color:var(--muted)}
  .wkday{position:relative;border-left:1px solid var(--line)}
  .wkline{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.06)}
  .wkev{position:absolute;display:block;text-decoration:none;color:var(--fg);background:var(--card2);
    border-left:3px solid var(--dot);border-radius:5px;padding:2px 5px;font-size:10.8px;line-height:1.3;
    overflow:hidden}
  .wkev:hover{background:#232a3b}
  .wkev .t{color:var(--muted);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:760px){ .wk{min-width:620px} .wkhead div{padding:6px 4px;font-size:11px} }
  .empty{color:var(--muted);padding:28px 4px}
  footer{color:var(--muted);font-size:11.5px;padding:0 22px 26px}
  @media(max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} .dow{display:none}
    .list .time{flex-basis:78px} }
</style>
</head>

</main>

day": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/guided-tour-art-japanese-publishing-3", "register": "", "audience": "", "description": "A 30-minute guided tour of the latest exhibition in the Milberg Gallery in Firestone Library at Princeton University. Tours meet in the lobby of Firestone Library. The advent of commercial publishing in 17th-century Japan completely revolutionized the Japanese art tradition. For the first time, art was not exclusively created for the upper classes who could afford to commission it for private use."}, {"title": "How QGIS and R work together", "source": "university", "start": "2026-10-13T13:30:00-04:00", "end": "2026-10-13T14:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/how-qgis-and-r-work-together-0", "register": "", "audience": "", "description": "QGIS can link to different software packages to run that package’s algorithms within QGIS. This workshop teaches how to link R statistical software to QGIS and run R scripts within QGIS itself. R plots can be viewed within QGIS, data can be transferred into other formats for processing in R, and results from R scripts can be returned to QGIS to be explored as GIS data. Students will use QGIS and R"}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-13T14:00:00-04:00", "end": "2026-10-13T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m."}, {"title": "McGraw Undergraduate Learning Program - Learning Concierge", "source": "university", "start": "2026-10 d. Building from my first book, Brassroots De"}, {"title": "Architects of Liberation: Modernism in Western Africa", "source": "university", "start": "2026-10-13T17:00:00-04:00", "end": "2026-10-13T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/architects-liberation-modernism-western-africa", "register": "", "audience": "", "description": "Across West Africa, the era of liberation and decolonization brought an extraordinary period of cultural experimentation and a profound reimagining of the future. From Ghana’s independence in 1957 through the decades that followed, newly independent nations turned to modern architecture to project forward-looking, progressive, and cosmopolitan visions of national identity. Shaped by broader politi"}, {"title": "Public Speaking Practice Sessions", "source": "university", "start": "2026-10-13T17:00:00-04:00", "end": "2026-10-13T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/public-speaking-practice-sessions-0", "register": "", "audience": "", "description": "Want to gain experience and confidence to become a more effective public speaker? Whether you are preparing for a presentation for class or a conference or just want to grow more comfortable in front of an audience, you are invited to monthly public speaking practice sessions at the Commons Library. What to expect: You will speak for up to 10 minutes in front of a supportive audience of university"}, {"title": "Althea Ward Clark W'21 Reading by Miriam Toews", "source": "university", "start": "2026-10-13T18:00:00-04:00", "end": "2026-10-13T19:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/althea-ward-clark-w21-reading-miriam-toews", "register": "", "audience": "", "description": "Best-selling novelist Miriam Toews reads from her work as part of the 2026-27 Althea Ward Clark W’21 Reading Serie  This event is geared toward students of any major graduating in 2029 and 2030."}, {"title": "Policy Analysis with R: Difference-in-Differences and Event Study Methods", "source": "university", "start": "2026-10-27T17:00:00-04:00", "end": "2026-10-27T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/policy-analysis-r-difference-differences-and-event-study-methods", "register": "", "audience": "", "description": "This workshop provides practical training in conducting difference-in-differences (DiD) analyses using R for policy evaluation. Participants will learn to implement both classical two-period DiD models and modern event study designs to assess policy effects over time. Using example datasets and step-by-step R code, the session will cover basic DiD estimation, visualization of event study dynamics,"}, {"title": "Get to Know Sales and Trading", "source": "careers", "start": "2026-10-27T18:00:00-04:00", "end": "2026-10-27T19:30:00-04:00", "allday": false, "location": "Friend Center 004", "category": "", "url": "https://careerdevelopment.princeton.edu/events/get-know-sales-and-trading", "register": "https://princeton.joinhandshake.com/edu/events/2015278", "audience": "Graduate Students, Undergraduate Students", "description": "Join an information session about Jane Street's Sales and Trading (https://www.janestreet.com/join-jane-street/departments/?dept=institutional-sales-and-trading) Internship. Learn how the team supports institutional clients across asset classes — from daily inquiries to broader market needs. Please note: Registration on Jane Street's form is required for the event. Registration will open two weeks"}, {"title": "C.K. Williams Reading by Jamel Brinkley and Creative Writing Seniors", "source": "university", "start": "2026-10-27T18:00:00-04:00", "end": "2026-10-27T19:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/ck-willi rcGIS", "source": "university", "start": "2026-10-28T10:30:00-04:00", "end": "2026-10-28T11:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/introduction-arcgis-0", "register": "", "audience": "", "description": "In this introduction to GIS workshop, you will use ArcGIS Pro software to explore geographic data, tables and create maps. This workshop will also show how to use the GIS Portal site that Princeton University Library hosts to add geographic data downloaded over the internet, and analyze data and create maps and then share them with the public. No previous GIS experience is needed to take this work"}, {"title": "Crafternoon at the Commons: Book Page Ghost Garland", "source": "university", "start": "2026-10-28T11:45:00-04:00", "end": "2026-10-28T12:45:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/crafternoon-commons-book-page-ghost-garland", "register": "", "audience": "", "description": "Crafternoons are designed to give you a short break to kick off your week and make something with your hands. Our workshops are low-stakes with easy-to-learn crafts designed to give you a fun finished product. During this workshop you’ll recycle pages of old books into ghostly figures and string them to make a spooky (but darling) garland to decorate your space. All supplies included. No experienc"}, {"title": "Wednesday Seminar Series, Mossavar-Rahmani Center for Iran & Persian Gulf Studies", "source": "university", "start": "2026-10-28T12:00:00-04:00", "end": "2026-10-28T13:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/wednesday-seminar-series-mossavar-rahmani-center-iran-persian-gulf-studies-8", "register": "", "audience": "", "description": "The Mossavar-Rahmini Center for Iran and Persian Gulf Studies invites a scholar to speak on their area of study. Topics relate to Iran and the Persian Gulf area while employing an interdisciplinary lens. To view the details of upcoming seminar topics, please visit iran.princeton.edu/events."}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-28T14:00:00-04:00", "end": "2026-10-28T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "McGraw Undergraduate Learning Program - Learning Concierge", "source": "university", "start": "2026-10-28T15:00:00-04:00", "end": "2026-10-28T16:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/mcgraw-undergraduate-learning-program-learning-concierge-14", "register": "", "audience": "", "description": "Stop by McGraw's Learning Concierge Desk in the 100-level of Frist Campus Center for all of your learning-related questions and needs. Grow with McGraw - even if you're managing your workload effectively, you always have room for growth to make your learning *efficient* too."}, {"title": "Pace Center Summer Internships Drop-in", "source": "university", "start": "2026-10-28T15:00:00-04:00", "end": "2026-10-28T16:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/pace-center- re information about internship and full-time opportunities, discuss career paths within technology, business and co"}, {"title": "Cognitive Science Office Hours", "source": "university", "start": "2026-10-28T17:00:00-04:00", "end": "2026-10-28T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/cognitive-science-office-hours", "register": "", "audience": "", "description": "Come learn about Princeton's Program in Cognitive Science! Undergraduates interested in cognitive science can learn from researchers about the field."}, {"title": "Amphibious Realities / Allan Sekula event", "source": "university", "start": "2026-10-28T17:00:00-04:00", "end": "2026-10-28T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/amphibious-realities-allan-sekula-event", "register": "", "audience": "", "description": "Join the Department of Comparative Literature for a public presentation and conversation with Gail Day and Steve Edwards on their recently published book Amphibious Realities: The Documentary Poetics of Allan Sekula (Verso, 2025), the first monograph on Allan Sekula (1951–2013), the award-winning anti-capitalist artist, photographer, filmmaker, and theorist. Amphibious Realities was named a Librar"}, {"title": "YDSA Weekly Meeting", "source": "university", "start": "2026-10-28T17:00:00-04:00", "end": "2026-10-28T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/ydsa-weekly-meeting-14", "register": "", "audience": "", "description": "Pull up to a meeting if you're interested in organizing community support programs, spreading socialist ideas, and building grassroots power to win a better world for the 99%!"}, {"title": "Costume Support (Drop in!)", "source": "university", "start": "2026-10-28T17:00:00-04:00", "end": "2026-10-28T18:00:00-04:00", "allday": false, "location": "", "category": "", "u ir organization, career paths, applications/recruiting or any other professional topic. While it is not a formal recruiting program, it does provide a chance to explore career options and start to develop a network. Registration for coffee chats continues until all slots with employers are filled. Par"}, {"title": "Reference Management with Zotero", "source": "university", "start": "2026-10-29T12:00:00-04:00", "end": "2026-10-29T13:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/reference-management-zotero-0", "register": "", "audience": "", "description": "This workshop will cover the basics of Zotero, including: Downloading the software and connecting it to Microsoft Word and Google Docs Adding sources to your Zotero library Navigating Zotero tools, such as files and folders Creating and editing Bibliographies"}, {"title": "Faculty and staff Bible study", "source": "university", "start": "2026-10-29T12:00:00-04:00", "end": "2026-10-29T13:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/faculty-and-staff-bible-study-2", "register": "", "audience": "", "description": "Open Bible study over lunch for Princeton staff and faculty - hosted by Princeton Christian Fellowship and Faculty Commons"}, {"title": "After Noon Concert Series", "source": "chapel", "start": "2026-10-29T12:30:00-04:00", "end": "2026-10-29T13:00:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://chapel.princeton.edu/events/after-noon-concert-series-9", "register": "", "audience": "", "description": "The After Noon Concert Series is a weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. Each visiting organist rehearses and performs, bringing forth a different voice and character from the org"}, {"title": "After Noon Concert Series", "source": "university", "start": "2026-10-29T12:30:00-04:00", "end": "2026-10-29T13:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/after-noon-concert-series-6", "register": "", "audience": "", "description": "A weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. East visiting organist rehearses and performs, bringing forth a different voice and charachter of the organ."}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-29T14:00:00-04:00", "end": "2026-10-29T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "Documentary: An Eye for an Eye", "source": "university", "start": "2026-10-29T16:15:00-04:00", "end": "2026-10-29T17:15:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/documentary-eye-eye", "register": "", "audience": "", "description": "A screening and conversation with documentary film director Tanaz Eshaghian about the documentary, An Eye for an Eye. The film unfolds like a real-life courtroom thriller that pulls you inside a justice system where the fate of a life doesn't rest with a judge, but in the hands of a grieving family who can choose retribution or forgiveness. Following the screening, faculty and researchers will eng"}, {"title": "Seminar: \"A Field Guide to Watersheds: Division and Unity\" by Eliza Griswold", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/seminar-field-guide-watersheds-division-and-unity-eliza-griswold", "register": "", "audience": "", "description": "Eliza Griswold is a Pulitzer Prize-winning journalist and director of the Program in Journalism at Princeton. As a basic building block of systems theory, the concept of a watershed defines and divides; it also unifies. While researching her book Amity & Prosperity, One Family and the Fracturing of America, which was awarded the Pulitzer Prize, Griswold spent seven years reporting inside a watersh"}, {"title": "Staying Alive in Hitler’s Berlin", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/staying-alive-hitlers-berlin", "register": "", "audience": "", "description": "Hitler never trusted Berliners, and many Berliners never trusted him. Berlin was the cosmopolitan metropolis which the Nazis liked to hate. Too many free spirits, too many sexual deviants, and too many Jews. When the Third Reich was finally defeated in May 1945, the city was in ruins. Bleiben Sie übrig, ‘stay alive’, is how Berliners said goodbye to each once British and American bombers attacked "}, {"title": "James A. Moffett '29 Lectures in Ethics", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/james-moffett-29-lectures-ethics-0", "register": "", "audience": "", "description": "James A. Moffett '29 Lectures in Ethics \"Democratically Governing Geoengineering Research\" Abstract: “Geoengineering” refers to the deliberate large-scale manipulation of the planetary environment to counteract anthropogenic climate change. While the idea of a serious, publicly funded research program into geoengineering is gaining traction due to insufficient efforts at decarbonization, many oppo"}, {"title": "Musicology Colloquium with Lydia Goehr", "source": "university", "start": "2026-10-29T16:30:00-04:00", "end": "2026-10-29T17:30:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/musicology-colloquium-lydia-goehr", "register": "", "audience": "", "description": "The Musicology Colloquium presents a talk by Lydia Goehr.Abstract From extended metaphors, we get the wit of extension: e-wit. Extension cords, like extended chords, may be elastic or exact in reaching a breaking point. Extended tonalities, extended techniques, and extended play: each stretches a norm without quite breaking it – until it does. This lecture seeks the e-wit on display in the Metropo"}, {"title": "Costume Support (Drop in!)", "source": "university", "start": "2026-10-29T17:00:00-04:00", "end": "2026-10-29T18:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/costume-support-drop-0", "register": "", "audience": "", "description": "Do you need dedicated space and supplies to make your cool Halloween costume? Stop by the PUL Makerspace on 10/29 from 5-8pm. We'll have glue guns, cardboard, paints, fabrics, wire, and other craft materials available while supplies last. Makerspace staff will be available if you need help figuring out what mat  of musical partnership. Their many recordings togethe"}, {"title": "Regression Beyond the Basics: Panel Data & Logit in R", "source": "university", "start": "2026-11-06T13:00:00-05:00", "end": "2026-11-06T14:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/regression-beyond-basics-panel-data-logit-r", "register": "", "audience": "", "description": "This workshop is intended for those who are already comfortable with the basics of R and linear regression. This session will cover the following topics: fixed-effects and random-effects models for panel data; logit, ordered logit, and more, for categorical outcomes; choosing between specifications and interpreting the results. Hardware/software prerequisites: Please make sure you have access to R"}, {"title": "Special Collections Showcase", "source": "university", "start": "2026-11-06T14:00:00-05:00", "end": "2026-11-06T15:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/special-collections-showcase-4", "register": "", "audience": "", "description": "Join Special Collections Librarians on the first floor of Firestone between 2pm and 4pm to see a selection of objects from across the collection and ask any questions you might have about and how to access our rare and special holdings!"}, {"title": "Competitive Programming Club", "source": "university", "start": "2026-11-06T17:00:00-05:00", "end": "2026-11-06T18:00:00-05:00", "allday": false, "location": "", "category": "", "url": "https://www.princeton.edu/events/2026/competitive-programming-club-7", "register": "", "audience": "", "description": "Come do Competitive Programming at Princeton! Improve your coding abilities. Increase your knowledge of algorithms and data structures. Learn problem solving skills."}, {"title": "Women's Volleyball vs Dartmouth", "source": "university", "start": "2026-11-06T18:00:00-05:00", "end": "2026-11-06T19:00:00-05:00", const SRC = Object.fromEntries(DATA.sources.map(s => [s.key, s]));
const EV = DATA.events.map(e => ({...e, d: new Date(e.start), e2: new Date(e.end)}));
const on = new Set(DATA.sources.map(s => s.key));
const chips = document.getElementById('chips');
DATA.sources.forEach(s => {
  const c = document.createElement('button');
  c.className = 'chip on'; c.style.setProperty('--dot', s.color);
  const n = EV.filter(e => e.source === s.key).length;
  c.innerHTML = `<span class="dot"></span>${s.label}<span class="n">${n}</span>`;
  c.onclick = () => { c.classList.toggle('on'); on.has(s.key) ? on.delete(s.key) : on.add(s.key); render(); };
  chips.appendChild(c);
});
const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
document.getElementById('dows').innerHTML = dows.map(d => `<div class="dow">${d}</div>`).join('');
const PARAMS = new URLSearchParams(location.search);
let view = ['month','week','list'].includes(PARAMS.get('view')) ? PARAMS.get('view') : 'month';
let cursor = PARAMS.get('date') ? new Date(PARAMS.get('date') + 'T12:00:00') : new Date(Date.now());
const fmtT = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(':00','');
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const vis = () => EV.filter(e => on.has(e.source));
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const col = e => (SRC[e.source] ? SRC[e.source].color : '#888');
const fmtHour = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');
const overlapsDay = (e, d) => {
  const a = new Date(e.d.getFullYear(), e.d.getMonth(), e.d.getDate());
  const b = new Date(e.e2.getFullYear(), e.e2.getMonth(), e.e2.getDate());
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return t >= a && t <= (e.allday ? new Date(b - 86400000) : b);
};

function render(){
  const ev = vis();
  document.getElementById('sub').textContent =
    `${ev.length} upcoming events · ${DATA.sources.length} sources · refreshed ${DATA.generated_label}`;
  document.getElementById('foot').textContent =
    'Scraped from chapel / career development / campus rec / university events. Toggles filter this page only.';
  for (const v of ['month','week','list'])
    document.getElementById(v).style.display = view === v ? '' : 'none';
  document.getElementById('bMonth').className = view === 'month' ? 'on' : '';
  document.getElementById('bWeek').className = view === 'week' ? 'on' : '';
  document.getElementById('bList').className = view === 'list' ? 'on' : '';
  if (view === 'month') renderMonth(ev);
  else if (view === 'week') renderWeek(ev);
  else renderList(ev);
}
function renderMonth(ev){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('mtitle').textContent =
    cursor.toLocaleDateString([], {month:'long', year:'numeric'});
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = new Date(); let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dayEv = ev.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    const cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (sameDay(d, today) ? ' today' : '');
    html += `<div class="${cls}"><div class="dnum"><span>${d.getDate()}</span></div>`;
    dayEv.slice(0,4).forEach(e => {
      html += `<a class="ev${e.allday?' all':''}" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">
        <span class="tm">${e.allday ? 'all day' : fmtT(e.d)}</span>${esc(e.title.slice(0,58))}</a>`;
    });
    if (dayEv.length > 4) html += `<div class="tm" style="color:var(--muted);font-size:10.5px">+${dayEv.length-4} more</div>`;
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}
function renderWeek(ev){
  const MAXLANES = 3;
  const ws = new Date(cursor); ws.setDate(ws.getDate() - ws.getDay()); ws.setHours(0,0,0,0);
  const days = []; for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const we = new Date(days[6]); we.setHours(23,59,59,999);
  document.getElementById('wtitle').textContent =
    days[0].toLocaleDateString([], {month:'long', day:'numeric'}) + ' to ' +
    days[6].toLocaleDateString([], {month:'long', day:'numeric', year:'numeric'});

  const week = ev.filter(e => e.d <= we && e.e2 >= days[0]);
  const ad = week.filter(e => e.allday);
  const timed = week.filter(e => !e.allday);
  const today = new Date();

  // hour window: fit the week's events, but keep a sane minimum span
  let h0 = 9, h1 = 20;
  timed.forEach(e => {
    h0 = Math.min(h0, Math.floor(e.d.getHours() + e.d.getMinutes() / 60));
    const endH = sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24;
    h1 = Math.max(h1, Math.ceil(endH));
  });
  h0 = Math.max(0, Math.min(h0, 8));
  h1 = Math.min(24, Math.max(h1, 18));
  const PX = 42, H = (h1 - h0) * PX;

  // pass 1: place each day's timed events into lanes, capped so columns stay readable
  const perDay = days.map(d => {
    const items = timed.filter(e => sameDay(e.d, d)).sort((a,b) => a.d - b.d);
    const laneEnds = [];
    const all = items.map(e => {
      const s = e.d.getHours() + e.d.getMinutes() / 60;
      const en = Math.max(s + 0.25, sameDay(e.d, e.e2) ? e.e2.getHours() + e.e2.getMinutes() / 60 : 24);
      let lane = laneEnds.findIndex(t => t <= s);
      if (lane === -1){ lane = laneEnds.length; laneEnds.push(en); } else laneEnds[lane] = en;
      return {e, s, en, lane};
    });
    const visible = all.filter(p => p.lane < MAXLANES);
    const hidden = all.filter(p => p.lane >= MAXLANES);
    const lanes = Math.max(1, Math.min(MAXLANES, laneEnds.length));
    return {d, visible, hidden, lanes};
  });

  // pass 2: render
  document.getElementById('wkHead').innerHTML = '<div>Time</div>' + perDay.map(({d, hidden}) =>
    `<div class="${sameDay(d, today) ? 'today' : ''}">${d.toLocaleDateString([], {weekday:'short'})}
      <b>${d.getDate()}</b>${hidden.length
        ? `<span class="more" title="${esc(hidden.slice(0,8).map(h => h.e.title).join(' | '))}">+${hidden.length}</span>`
        : ''}</div>`).join('');

  document.getElementById('wkAllday').innerHTML = '<div class="lab">all day</div>' + days.map(d => {
    const items = ad.filter(e => overlapsDay(e, d)).sort((a,b) => a.d - b.d);
    return '<div class="cell">' + items.map(e =>
      `<a class="wkad" style="--dot:${col(e)}" href="${e.url}" target="_blank"
        title="${esc(e.title)}${e.location ? ' · ' + esc(e.location) : ''}">${esc(e.title.slice(0,30))}</a>`
    ).join('') + '</div>';
  }).join('');

  let gut = '';
  for (let h = h0; h <= h1; h++) gut += `<div class="wkhr" style="top:${(h - h0) * PX}px">${fmtHour(h)}</div>`;
  let lines = '';
  for (let h = h0 + 1; h < h1; h++) lines += `<div class="wkline" style="top:${(h - h0) * PX}px"></div>`;

  document.getElementById('wkScroll').innerHTML =
    `<div class="wkgut" style="height:${H}px">${gut}</div>` +
    perDay.map(({visible, lanes}) => {
      const w = 100 / lanes;
      const blocks = visible.map(p => {
        const top = (p.s - h0) * PX, hh = Math.max(22, (Math.min(p.en, h1) - p.s) * PX - 3);
        const det = [p.e.location, p.e.audience].filter(Boolean).join(' · ');
        const span = (lanes === 1 && sameDay(p.e.d, p.e.e2)) ? ' to ' + fmtT(p.e.e2) : '';
        return `<a class="wkev" href="${p.e.url}" target="_blank" style="--dot:${col(p.e)};top:${top}px;height:${hh}px;
          left:calc(${p.lane * w}% + 2px);width:calc(${w}% - 4px)" title="${esc(p.e.title)}${det ? ' · ' + esc(det) : ''}">
          <span class="t">${fmtT(p.e.d)}${span}</span>
          <b>${esc(p.e.title.slice(0,70))}</b>
          ${hh >= 46 && p.e.location ? `<span class="t">${esc(p.e.location.slice(0,40))}</span>` : ''}</a>`;
      }).join('');
      return `<div class="wkday" style="height:${H}px">${lines}${blocks}</div>`;
    }).join('');
}
function renderList(ev){
  const groups = {};
  ev.forEach(e => { const k = e.d.toDateString(); (groups[k] = groups[k] || []).push(e); });
  const keys = Object.keys(groups).sort((a,b) => new Date(a) - new Date(b)).slice(0, 45);
  if (!keys.length){ document.getElementById('list').innerHTML = '<div class="empty">Nothing ahead for the selected sources.</div>'; return; }
  document.getElementById('list').innerHTML = keys.map(k => {
    const d = new Date(k);
    const rows = groups[k].sort((a,b) => a.d - b.d).map(e => {
      const col = SRC[e.source] ? SRC[e.source].color : '#888';
      const lbl = SRC[e.source] ? SRC[e.source].label : e.source;
      const time = e.allday ? 'All day' : fmtT(e.d) + (e.end !== e.start ? ' – ' + fmtT(e.e2) : '');
      const meta = [e.location, e.audience].filter(Boolean).join(' · ');
      const desc = (e.description || '').slice(0, 190);
      return `<div class="row"><div class="time">${time}</div><div class="body">
        <a href="${e.url}" target="_blank">${e.title}</a>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${desc ? `<div class="desc">${desc}${(e.description || '').length > 190 ? '…' : ''}</div>` : ''}
        <div class="chips"><span class="src" style="--dot:${col}">${lbl}</span>
          <a class="src reg" href="${e.url}" target="_blank">event page</a>
          ${e.register ? `<a class="src reg" href="${e.register}" target="_blank">register</a>` : ''}
        </div>
      </div></div>`;
    }).join('');
    return `<div class="daygroup"><h3>${d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})}</h3>${rows}</div>`;
  }).join('');
}
document.getElementById('prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
document.getElementById('next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };
document.getElementById('today').onclick = () => { cursor = new Date(); render(); };
document.getElementById('bMonth').onclick = () => { view = 'month'; render(); };
document.getElementById('bWeek').onclick = () => { view = 'week'; render(); };
document.getElementById('bList').onclick = () => { view = 'list'; render(); };
document.getElementById('wprev').onclick = () => { cursor.setDate(cursor.getDate() - 7); render(); };
document.getElementById('wnext').onclick = () => { cursor.setDate(cursor.getDate() + 7); render(); };
document.getElementById('wtoday').onclick = () => { cursor = new Date(); render(); };
render();
</script>
