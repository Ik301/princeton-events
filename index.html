dees will use ArcGIS Pro installed on classroom Wi"}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-09-22T14:00:00-04:00", "end": "2026-09-22T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "McGraw Undergraduate Learning Program - Learning Concierge", "source": "university", "start": "2026-09-22T15:00:00-04:00", "end": "2026-09-22T16:00:00-04:00", "allday": false, "location": "Frist Campus Center, Table C3", "category": "", "url": "https://www.princeton.edu/events/2026/mcgraw-undergraduate-learning-program-learning-concierge-3", "register": "", "audience": "Open to the Public, Students", "description": "Stop by McGraw's Learning Concierge Desk in the 100-level of Frist Campus Center for all of your learning-related questions and needs. Grow with McGraw - even if you're managing your workload effectively, you always have room for growth to make your learning *efficient* too."}, {"title": "Seuls en Scène 2026 presents a film screening of De la Comédie-Française by Martin Darondeau & Bertrand Usclat", "source": "university", "start": "2026-09-22T16:00:00-04:00", "end": "2026-09-22T17:00:00-04:00", "allday": false, "location": "Garden Theatre", "category": "", "url" tion of democratic states. While Europeans like to think that they were responsible for the project of European integration, they were largely executing a plan that Americans had set in motion. American Europe h"}, {"title": "In Conversation with Aaron Bennett", "source": "university", "start": "2026-09-22T16:30:00-04:00", "end": "2026-09-22T17:30:00-04:00", "allday": false, "location": "Whig Hall, 301 James Madison Room", "category": "", "url": "https://www.princeton.edu/events/2026/conversation-aaron-bennett", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "In Conversation with Aaron Bennett, Nancy Pelosi's Former Speechwriter"}, {"title": "Princeton Students in Quantum Weekly Workshop", "source": "university", "start": "2026-09-22T16:30:00-04:00", "end": "2026-09-22T17:30:00-04:00", "allday": false, "location": "Friend Center, 008", "category": "", "url": "https://www.princeton.edu/events/2026/princeton-students-quantum-weekly-workshop-1", "register": "", "audience": "Students", "description": "Join us for our weekly workshop series where students can come together to explore key topics in quantum science. These sessions are a chance to learn, ask questions, and collaborate with peers in a supportive environment—whether you’re just curious about quantum or already deeply involved."}, {"title": "What is Missing? What if? - Exhibition Opening and Artist Talk with Maya Lin", "source": "university", "start": "2026-09-22T16:30:00-04:00", "end": "2026-09-22T17:30:00-04:00", "allday": false, "location": "Briger Hall, C112 Lecture Hall", "category": "", "url": "https://www.princeton.edu/events/2026/what-missing-what-if-exhibition-opening-and-artist-talk-maya-lin", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "Join Princeton University’s High Meadows Environmental Institute for a talk by artist Maya Lin and the public opening of Maya Lin’s What Is Missing? What If?, a science-based art exhibition that examines how resilient the natural world can be – if we choose to protect it. The artist will speak about her work in the Briger Hall auditorium at 4:30pm, and be joined on stage by David Wilcove, Henry W."}, {"title": "Black Theater Initiative: An Introduction to the Choreopoem with Chesney Snow", "source": "university", "start": "2026-09-22T17:00:00-04:00", "end": "2026-09-22T18:00:00-04:00", "allday": false, "location": "Drapkin Studio, Lewis Arts Complex", "category": "", "url": "https://www.princeton.edu/events/2026/black-theater-initiative-introduction-choreopoem-chesney-snow", "register": "", "audience": "Students", "description": "The choreopoem is an important form of dramatic expression that combines poetry, music, dance, and song. Lecturer in Theater Chesney Snow will lead students in a hands-on workshop, and no performance experience required to participate. The Black Theater Initiative engages students of all backgrounds with Black theater artists, practices, and innovations that shape the American theater. This is a D"}, {"title": "Althea Ward Clark W'21 Reading by Katie Farris and Jamil Jan Kochai", "source": "university", "start": "2026-09-22T18:00:00-04:00", "end": "2026-09-22T19:00:00-04:00", "allday": false, "location": "Labyrinth Books", "category": "", "url": "https://www.princeton.edu/events/2026/althea-ward-clark-w21-reading-katie-farris-and-jamil-jan-kochai", "register": "", "audience": "Open to the Public", "description": "Associate Professor of Creative Writing Katie Farris, a multi-Pushcart Prize winning poet shortlisted for the T.S. Elliot Prize, and Assistant Professor of Creative Writing Jamil Jan Kochai, a National Book Award in Fiction finalist, read from their work to open the 2026-27 Althea Ward Clark W’21 Reading Series. This event is cosponsored by the Lewis Center for the Arts and Labyrinth Books. At the"}, {"title": "Princeton Shotokan Karate Organization", "source": "university", "start": "2026-09-22T18:30:00-04:00", "end": "2026-09-22T19:30:00-04:00", "allday": false, "location": "New Graduate College, Common Room", "category": "", "url": "https://www.princeton.edu/events/2026/princeton-shotokan-karate-organization-28", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Weekly training/lessons in Shotokan karate by a 3rd Dan black belt. All levels welcome, including complete beginners with no prior experience. Trainings will involve warm-up exercises, instruction in basic motions and preparation for performance of karate Kata. This event/program is open to all Princeton University students regardless of identity."}, {"title": "Men's Soccer vs Seton Hall", "source": "university", "start": "2026-09-22T19:00:00-04:00", "end": "2026-09-22T20:00:00-04:00", "allday": false, "location": "Roberts Stadium, Roberts Stadium/Myslik Field", "category": "", "url": "https://www.princeton.edu/events/2026/mens-soccer-vs-seton-hall", "register": "", "audience": "Open to the Public", "description": "Men's Soccer vs Seton Hall"}, {"title": "Princeton Christian Fellowship Bible studies", "source": "university", "start": "2026-09-22T20:00:00-04:00", "end": "2026-09-22T21:00:00-04:00", "allday": false, "location": "Dodge Hall, 103 Meeting Room, Dodge Hall, 104 Meeting Room", "category": "", "url": "https://www.princeton.edu/events/2026/princeton-christian-fellowship-bible-studies-0", "register": "", "audience": "Students", "description": "Princeton Christian Fellowship small group Bible studies for soph/jr women (MD 103) and senior men/women (MD 104)"}, {"title": "Out After Dark: Exhibition by Tamara Santibañez", "source": "university", "start": "2026-09-23T00:00:00-04:00", "end": "2026-09-24T00:00:00-04:00", "allday": true, "location": "Hurley Gallery, Lewis Arts Complex", "category": "", "url": "https://www.princeton.edu/events/2026/out-after-dark-exhibition-tamara-santibanez-14", "register": "", "audience": "Open to the Public", "description": "Out After Dark is an exhibition by 2025-2027 Princeton Arts Fellow Tamara Santibañez that calls attention to the bodily negotiations we make to access space within shifting landscapes of law and power, speculating on how we might rethink and remake these tacit agreements. Here, the body is referenced less through its visuality than by its presence moving through the exhibit, or the materiality of "}, {"title": "So You Think You Can Sing: Karaoke Competition", "source": "university", "start": "2026-09-23T01:00:00-04:00", "end": "2026-09-23T02:00:00-04:00", "allday": false, "location": "Frist Campus Center, Easel 100 Main East, Frist Campus Center, Easel A Level", "category": "", "url": "https://www.princeton.edu/events/2026/so-you-think-you-can-sing-karaoke-competition-3", "register": "", "audience": "Students", "description": "A low-stakes, high-fun karaoke event with free food and prizes!"}, {"title": "Princeton Bioethics Exchange", "source": "university", "start": "2026-09-23T11:30:00-04:00", "end": "2026-09-23T12:30:00-04:00", "allday": false, "location": "Briger Hall, B431 Conference Room", "category": "", "url": "https://www.princeton.edu/events/2026/princeton-bioethics-exchange", "register": "", "audience": "Faculty & Academic Professionals", "description": "Princeton biophysicist Robert Austin's recent work has examined how bacteria can be driven to evolve defenses against viruses that infect them. But what if we flip that approach and engineer viruses that overcome bacterial defenses? Prof. Austin will lead a conversation about what these experiments could teach us and whether they should be pursued. Led and co-moderated by Penelope Georges of the C"}, {"title": "Career Essentials: Writing a Cover Letter", "source": "careers", "start": "2026-09-23T12:30:00-04:00", "end": "2026-09-23T13:00:00-04:00", "allday": false, "location": "Frist Campus Center, Class of 1952 Room", "category": "", "url": "https://careerdevelopment.princeton.edu/events/career-essentials-writing-cover-letter", "register": "https://app.joinhandshake.com/edu/events/1977163", "audience": "", "description": "Cover letters can be intimidating when you’re unsure what to say beyond what is already on your resume. A strong cover letter helps an employer understand not only what you’ve done, but also what makes you a strong candidate. This introductory session also offers an opportunity to brainstorm ideas of what to include in a cover letter. In this program, you will learn: 1. The purpose of a cover lett"}, {"title": "Open Studio", "source": "university", "start": "2026-09-23T13:00:00-04:00", "end": "2026-09-23T14:00:00-04:00", "allday": false, "location": "Art Museum, 136 Creativity Lab", "category": "", "url": "https://www.princeton.edu/events/2026/open-studio-108", "register": "", "audience": "Open to the Public", "description": "Open Studio Hours We provide the materials, you bring the creativity! Drop in for arts activities rooted in discovery and inspired by works from the Museum’s collections and special exhibitions."}, {"title": "Essential QGIS Tools for Research", "source": "university", "start": "2026-09-23T13:30:00-04:00", "end": "2026-09-23T14:30:00-04:00", "allday": false, "location": "Lewis Library - Computer Classroom (225), Lewis Science Library", "category": "", "url": "https://www.princeton.edu/events/2026/essential-qgis-tools-research", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "In this class, students will learn how to use GIS (geographic information system) tools to calculate distances between two features, road and river lengths within administrative units, the percentage of shared boundaries between two areas, extract information on polygon neighbors between two areas, and will explore many other analysis tools. Attendees will use QGIS on classroom Windows computers. "}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-09-23T14:00:00-04:00", "end": "2026-09-23T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "Opening event: \"Real and Remembered: Princetonians Caught between Study and Revolution\"", "source": "university", "start": "2026-09-23T14:00:00-04:00", "end": "2026-09-23T15:00:00-04:00", "allday": false, "location": "Mudd Manuscript Library, Mudd Manuscript Library", "category": "", "url": "https://www.princeton.edu/events/2026/opening-event-real-and-remembered-princetonians-caught-between-study-and-revolution", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Join us for the public opening of \"Real and Remembered: Princetonians Caught between Study and Revolution.\" Even before the American Revolution directly impacted campus life–with Nassau Hall occupied, classes disrupted, and students leaving to fight–Princeton had become a center of revolutionary thought and youthful activism. The Revolution was a key part of institutional identity and school spiri"}, {"title": "2026 Junior Independent Work Research Forum", "source": "university", "start": "2026-09-23T14:55:00-04:00", "end": "2026-09-23T15:55:00-04:00", "allday": ion": "Marquand Art Library, Marquand Art Library", "category": "", "url": "https://www.princeton.edu/events/2026/tour-marquand-library-2", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Marquand Library, founded in 1908, is one of the finest art libraries in North America. Marquand re-opened within the new Art Museum complex after an almost five-year hiatus in January 2026. Tours of the five-floor non-circulating library will be led by Rebecca Friedman, Art Librarian for Research Services, who has worked at Marquand since 2007. Be our guest where you'll learn more about the build"}, {"title": "Yale Law School Visit", "source": "careers", "start": "2026-09-23T16:30:00-04:00", "end": "2026-09-23T17:30:00-04:00", "allday": false, "location": "Frist Campus Center 302", "category": "", "url": "https://careerdevelopment.princeton.edu/events/yale-law-school-visit", "register": "https://princeton.joinhandshake.com/edu/events/1995856", "audience": "Graduate Students, Undergraduate Students", "description": "Join a Yale Law School representative who will share in-depth information about their school and what current and future applicants should consider when applying. This is an opportunity to learn about their clinics, curriculum and admission criteria. This program is open to all Princeton University undergraduate and graduate students regardless of identity. Email [careerdevelopment@princeton.edu]("}, {"title": "InterVarsity Small Group", "source": "university", "start": "2026-09-23T16:30:00-04:00", "end": "2026-09-23T17:30:00-04:00", "allday": false, "location": "Frist Campus Center, 212", "category": "", "url": "https://www.princeton.edu/events/2026/intervarsity-small-group", "register": "", "audience": "Students", "description": "Boba Chats is a safe space to explore faith in Jesus no matter your faith background. We will be studying through 1 John!"}, {"title": "From Rulers’ Dwellings to Temples, Thirty Years On | PITHOS (Princeton-Ioannina-Thessaly On-Site Seminars) Graduate Exchange Program Lecture", "source": "university", "start": "2026-09-23T16:30:00-04:00", "end": "2026-09-23T17:30:00-04:00", "allday": false, "location": "Art Museum, 134 Small Auditorium", "category": "", "url": "https://www.princeton.edu/events/2026/rulers-dwellings-temples-thirty-years-pithos-princeton-ioannina-thessaly-site-seminars", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students", "description": "In my lecture, I will return to an earlier thesis of mine in order to reassess its validity. The main idea posited that in the Early Iron Age, at least until the mid 8th century B.C., certain functions later associated with urban temples were originally fulfilled by the dwellings of the “rulers” or, more generally, by the residences of local elites. The primary role of these edifices was to host l"}, {"title": "Study Abroad Programs in Asia Info Session", "source": "university", "start": "2026-09-23T16:30:00-04:00", "end": "2026-09-23T17:30:00-04:00", "allday": false, "location": "Louis A. Simpson International Building, A66", "category": "", "url": "https://www.princeton.edu/events/2026/study-abroad-programs-asia-info-session", "register": "", "audience": "Students", "description": "Learn more about undergraduate study abroad opportunities in Asia! Study abroad advisers will go through the various programs, as well as other factors such as financial aid, timing, and other planning considerations. Open to all years and majors."}, {"title": "2028 Summer Analyst Intro to Evercore", "source": "careers", "start": "2026-09-23T17:30:00-04:00", "end": "2026-09-23T19:00:00-04:00", "allday": false, "location": "Julis Romo Rabinowitz Building A17", "category": "", "url": "https://careerdevelopment.princeton.edu/events/2028-summer-analyst-intro-evercore", "register": "", "audience": "", "description": "Evercore is hosting an educational event for first-years and sophomores. The session will include an overview of investment banking and a brief introduction to the firm. Students will also get to network with Evercore representatives from the New York office. The goal of the session is to introduce first-years and sophomores to the firm in advance of recruitment for the Summer 2028 Junior Internsh"}, {"title": "Joyce Carol Oates and Katherine Nouri Hughes in Conversation", "source": "university", "start": "2026-09-23T18:00:00-04:00", "end": "2026-09-23T19:00:00-04:00", "allday": false, "location": "Labyrinth Books", "category": "", "url": "https://www.princeton.edu/events/2026/joyce-carol-oates-and-katherine-nouri-hughes-conversation", "register": "", "audience": "Open to the Public", "description": "Creative Writing Professor Emerita Joyce Carol Oates and Katherine Nouri Hughes join in conversation and read from their latest works. Free & open to the public."}, {"title": "The Stage Manager’s Guide to Adulting", "source": "university", "start": "2026-09-23T18:30:00-04:00", "end": "2026-09-23T19:30:00-04:00", "allday": false, "location": "Light Lab, Lewis Arts Complex", "category": "", "url": "https://www.princeton.edu/events/2026/stage-managers-guide-adulting", "register": "", "audience": "Students", "description": "At this hands-on, drop-in event, acquire in-demand skills and immediately apply them to your life. Led by LCA staff members, Production Stage Manager Carmelita Becnel and Stage Manager Milan Eldridge. Offered as part of the Program in Theater & Music Theater's Try on Theater Days . Admission The workshop is free and open to all University students. Directions Get directions to the Light Lab , loca"}, {"title": "Jazz Vespers", "source": "chapel", "start": "2026-09-23T20:00:00-04:00", "end": "2026-09-23T21:00:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://chapel.princeton.edu/events/jazz-vespers-12", "register": "", "audience": "", "description": "An inclusive experience of poetry, music, ister": "https://app.joinhandshake.com/edu/events/1999824", "audience": "Graduate Students, Undergraduate Students", "description": "Hong Kong offers a unique opportunity to build international experience in one of Asia’s most connected and dynamic cities. As a leading international financial centre, the city is also home to thriving industries in technology, professional services, logistics, healthcare and more. After graduation, students may be eligible to work in Hong Kong for at least two years under dedicated talent admiss"}, {"title": "Faculty and staff Bible study", "source": "university", "start": "2026-09-24T12:00:00-04:00", "end": "2026-09-24T13:00:00-04:00", "allday": false, "location": "Frist Campus Center, Class of 1952 Room", "category": "", "url": "https://www.princeton.edu/events/2026/faculty-and-staff-bible-study-0", "register": "", "audience": "Faculty & Academic Professionals, Staff", "description": "Open Bible study over lunch for Princeton staff and faculty - hosted by Princeton Christian Fellowship and Faculty Commons"}, {"title": "After Noon Concert Series", "source": "chapel", "start": "2026-09-24T12:30:00-04:00", "end": "2026-09-24T13:00:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://chapel.princeton.edu/events/after-noon-concert-series-9", "register": "", "audience": "", "description": "The After Noon Concert Series is a weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. Each visiting organist rehearses and performs, bringing forth a different voice and character from the org"}, {"title": "Marketing Your Study Abroad Experience", "source": "careers", "start": "2026-09-24T12:30:00-04:00", "end": "2026-09-24T13:30:00-04:00", "allday": false, "location": "Louis A. Simpson International Building A66", "category": "", "url": "https://careerdevelopment.princeton.edu/events/marketing-your-study-abroad-experience", "register": "https://princeton.joinhandshake.com/edu/events/2005208", "audience": "", "description": "This program will help you identify the experiences, stories and skills you gained from your study abroad experience to share in your resume, cover letters and interviews. You will walk away with next steps to help you market yourself to potential employers. This program is co-sponsored by the Study Abroad Office. This program is open to all Princeton University undergraduates regardless of identi"}, {"title": "After Noon Concert Series", "source": "university", "start": "2026-09-24T12:30:00-04:00", "end": "2026-09-24T13:30:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://www.princeton.edu/events/2026/after-noon-concert-series-2", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "A weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. East visiting organist rehearses and performs, bringing forth a different voice and charachter of the organ."}, {"title": "Open Studio", "source": "university", "start": "2026-09-24T13:00:00-04:00", "end": "2026-09-24T14:00:00-04:00", "allday": false, "location": "Art Museum, 136 Creativity Lab", "category": "", "url": "https://www.princeton.edu/events/2026/open-studio-109", "register": "", "audience": "Open to the Public", "description": "Open Studio Hours We provide the materials, you bring the creativity! Drop in for arts activities rooted in discovery and inspired by works from the Museum’s collections and special exhibitions."}, {"title": "Essential ArcGIS Pro Tools for Research", "source": "university", "start": "2026-09-24T13:30:00-04:00", "end": "2026-09-24T14:30:00-04:00", "allday": false, "location": "Lewis Library - Computer Classroom (225), Lewis Science Library", "category": "", "url": "https://www.princeton.edu/events/2026/essential-arcgis-pro-tools-research", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "In this class, students will learn how to use GIS (geographic information system) tools to calculate distances between two features, road and river lengths within administrative units, the percentage of shared boundaries between two areas, extract information on polygon neighbors between two areas, and will explore many other analysis tools. Attendees will use ArcGIS Pro installed on the classroom"}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-09-24T14:00:00-04:00", "end": "2026-09-24T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "Graduate Students Individual Development Planning Small Group Meetings", "source": "careers", "start": "2026-09-24T15:00:00-04:00", "end": "2026-09-24T16:00:00-04:00", "allday": false, "location": "Center for Career Development, Room 208", "category": "", "url": "https://careerdevelopment.princeton.edu/events/graduate-students-individual-development-planning-small-group-meetings", "register": "https://princeton.joinhandshake.com/edu/events/1963698", "audience": "", "description": "This series of small group meetings will support humanities Ph.D. students in their second year as they develop strategies for navigating their academic and professional growth. Participants will develop a better understanding of their career goals and will walk away with actionable next steps. Through monthly small-group meetings, students will reflect on their skills, interests, values, and goal"}, {"title": "Barclays Info Session & Networking at Nassau Club", "source": "careers", "start": "2026-09-24T16:00:00-04:00", "end": "2026-09-24T18:00:00-04:00", "allday": false, "location": "Nassau Club", "category": "", "url": "https://careerdevelopment.princeton.edu/events/barclays-info-session-networking-nassau-club", "register": "https://princeton.joinhandshake.com/edu/events/2013740", "audience": "Graduate Students, Undergraduate Students", "description": "Barclays invites Princeton Sophomores interested in Markets, Research or Investment Banking to join an engaging discussion about 2028 Summer Internship opportunities. Hear directly from Barclays professionals as they share their experiences, discuss current trends shaping the industry and provide insights into life at Barclays. Whether beginning to explore finance or already considering a career i"}, {"title": "Study Abroad 101 - Beyond the Bubble - Info Session", "source": "university", "start": "2026-09-24T16:30:00-04:00", "end": "2026-09-24T17:30:00-04:00", "allday": false, "location": "Julis Romo Rabinowitz Building, A97", "category": "", "url": "https://www.princeton.edu/events/2026/study-abroad-101-beyond-bubble-info-session", "register": "", "audience": "Students", "description": "Join the Study Abroad Program in our Beyond the Bubble Info Session to learn more about undergraduate study abroad at Princeton! Study abroad advisers will introduce the basics and answer your questions about summer, semester, and academic year programs, as well as other factors such as financial aid, timing, and other planning considerations."}, {"title": "Solar Stripes Introductory Meeting", "source": "university", "start": "2026-09-24T16:30:00-04:00", "end": "2026-09-24T17:30:00-04:00", "allday": false, "location": "Frist Campus Center, 302", "category": "", "url": "https://www.princeton.edu/events/2026/solar-stripes-introductory-meeting", "register": "", "audience": "Students", "description": "Solar Stripes introductory meeting for all those interested in joining our cause --- installing solar panels in Puerto Rico for households who need it most"}, {"title": "Curator Talk | Intimate Grief: Death in Ancient Greece", "source": "university", "start": "2026-09-24T16:30:00-04:00", "end": "2026-09-24T17:30:00-04:00", "allday": false, "location": "Art Museum, 100 Grand Hall", "category": "", "url": "https://www.princeton.edu/events/2026/curator-talk-intimate-grief-death-ancient-greece", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "A curatorial discussion of funerary objects and rituals in ancient Greece In this talk, Carolyn Laferrière, curator of ancient Mediterranean art, and Nathan Arrington, professor and chair of the Department of Art & Archaeology and Hellenic Studies, will discuss how mortuary objects in ancient Greece could establish intimate connections between the living and the dead, allowing mourners to approach"}, {"title": "Seuls en Scène 2026 presents L’Aube des questions - Festival d’Avignon 2026 with Aurélie Charon, Emma Prat & Oksana Leuta", "source": "university", "start": "2026-09-24T16:30:00-04:00", "end": "2026-09-24T17:30:00-04:00", "allday": false, "location": "East Pyne Building 010", "category": "", "url": "https://www.princeton.edu/events/2026/seuls-en-scene-2026-presents-laube-des-questions-f periment in collective attention. It is an invitation to what is possible when listening is treated as a public resource, and when a space is dedicated to holding opacity rather than resolution. For seven days, the CoLab is transformed into a public space to stay, listen, return, and experience sound together. Schedule of Live Sound "}, {"title": "Crafternoon at the Commons: Bag Charm", "source": "university", "start": "2026-09-30T11:45:00-04:00", "end": "2026-09-30T12:45:00-04:00", "allday": false, "location": "Commons Library Curiosity Studio, Commons Library", "category": "", "url": "https://www.princeton.edu/events/2026/crafternoon-commons-bag-charm", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Crafternoons are designed to give you a short break to kick off your week and make something with your hands. Our workshops are low-stakes with easy-to-learn crafts designed to give you a fun finished product. During this workshop you’ll craft cute and whimsical bag charms out of a variety of materials. Maybe you'll create something inspired by a bag charm you've seen or maybe you'll feel inspired"}, {"title": "Study Abroad in Hong Kong", "source": "university", "start": "2026-09-30T12:15:00-04:00", "end": "2026-09-30T13:15:00-04:00", "allday": false, "location": "Louis A. Simpson International Building, A66", "category": "", "url": "https://www.princeton.edu/events/2026/study-abroad-hong-kong", "register": "", "audience": "Students", "description": "Join the Office of International Programs to learn about semester study abroad opportunities in Hong Kong."}, {"title": "Open Studio", "source": "university", "start": "2026-09-30T13:00:00-04:00", "end": "2026-09-30T14:00:00-04:00", "allday": false, "location": "Art Museum, 136 Creativity Lab", "category": "", "url": "https://www.princeton.edu/events/2026/open-studio-115", "register": "", "audience": "Open to the Public", "description": "Open Studio Hours We provide the mat audience": "Faculty & Academic Professionals, Staff, Students", "description": "IIIF (International Image Interoperability Framework) can be a way to help you view and curate digital collections of high-resolution images more effectively and creatively. Yichin Chen, Curator of Asian Collections and Digital Specialist at Visual Resources, Department of Art & Archaeology, will introduce what IIIF is, how it can be used in courses, and what role AI can play in its integration. S"}, {"title": "After Noon Concert Series", "source": "chapel", "start": "2026-10-01T12:30:00-04:00", "end": "2026-10-01T13:00:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://chapel.princeton.edu/events/after-noon-concert-series-9", "register": "", "audience": "", "description": "The After Noon Concert Series is a weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. Each visiting organist rehearses and performs, bringing forth a different voice and character from the org"}, {"title": "After Noon Concert Series", "source": "university", "start": "2026-10-01T12:30:00-04:00", "end": "2026-10-01T13:30:00-04:00", "allday": false, "location": "Chapel", "category": "", "url": "https://www.princeton.edu/events/2026/after-noon-concert-series-3", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "A weekly opportunity for the Princeton Community to enjoy performances at the Princeton University Chapel by various local, national, and international organists. These half-hour concerts showcase the flexibility of the magnificent Skinner/Mander Chapel organ. East visiting organist rehearses and performs, bringing forth a different voice and charachter of the organ."}, {"title": "Using Tables and Maps together in QGIS", "source": "university", "start": "2026-10-01T13:30:00-04:00", "end": "2026-10-01T14:30:00-04:00", "allday": false, "location": "Lewis Library - Computer Classroom (225), Lewis Science Library", "category": "", "url": "https://www.princeton.edu/events/2026/using-tables-and-maps-together-qgis", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "U.S. Census data can be integrated with GIS (geographic information system) boundary files to analyze the spatial relationships of poverty, ethnicity, environmental risk, and other parameters. We will find and download demographic data, combine the data with GIS files, and view the data in QGIS. The QGIS Python console and editor will be used to build a Python script to process data. The session w"}, {"title": "Drop-in Advising for Undergraduate Students", "source": "careers", "start": "2026-10-01T14:00:00-04:00", "end": "2026-10-01T16:00:00-04:00", "allday": false, "location": "Center for Career Development", "category": "", "url": "https://careerdevelopment.princeton.edu/events/drop-advising-undergraduate-students-28", "register": "https://princeton.joinhandshake.com/stu/events?collection=ALL&eventFormat=IN_PERSON&sort=RELEVANCE&date=ALL&keyword=Drop-in%20Advising%20for%20Undergraduate%20Students", "audience": "", "description": "Drop-ins are 20-minute, advising sessions for undergraduates that do not require an appointment. In-person drop-ins for the fall semester begin on Monday, August 31 and are held most weekdays from 2-4 p.m. Students are welcome to come at any point during those times that fit their schedules. They are held at the Center for Career Development (above the U-Store on 36 University Place). You can come"}, {"title": "Georgetown Law School Virtual Info Session", "source": "careers", "start": "2026-10-01T15:00:00-04:00", "end": "2026-10-01T16:00:00-04:00", "allday": false, "location": "", "category": "", "url": "https://careerdevelopment.princeton.edu/events/georgetown-law-school-virtual-info-session", "register": "https://princeton.joinhandshake.com/edu/events/1995693", "audience": "Graduate Students, Undergraduate Students", "description": "Join Georgetown Law Center’s (GULC) admission representative as they share in-depth information about GULC and what current and future applicants should consider when applying. This is an opportunity to learn about GULC clinics, curriculum and admission criteria. You must also register through GULC (https://georgetown.zoom.us/meeting/register/EZWfN9CTRUquFEuCfP-0iw#/registration) and you will rece"}, {"title": "Composition Colloquium with Nico Muhly", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Woolworth Center, Mendel Music Library (Room TBA)", "category": "", "url": "https://www.princeton.edu/events/2026/composition-colloquium-nico-muhly", "register": "", "audience": "Open to the Public", "description": "The Composition Colloquium presents a talk by composer Nico Muhly . Abstract Nico Muhly, born in 1981, is an American composer who writes orchestral music, works for the stage, chamber music and sacred music. He’s received commissions from The Metropolitan Opera: Two Boys, (2011) and Marnie (2018); Carnegie Hall, the Los Angeles Philharmonic, the Tallis Scholars, King’s College and St John’s Colle"}, {"title": "The Keeper of My Kin, Ada Ferrer", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Chancellor Green, 101 Rotunda", "category": "", "url": "https://www.princeton.edu/events/2026/keeper-my-kin-ada-ferrer", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students", "description": "A book reading and conversation from Pulitzer Prize–winning author Ada Ferrer on her latest memoir. A memoir about migration, separation, and the love of one family forcing its way through the fissures of history. Professor Ferrer’s Pulitzer Prize-winning book Cuba: An American History (Scribner, 2021) is a sweeping history of more than five hundred years of Cuban history, written in rousing and a"}, {"title": "Performance and Contradiction: Acting Natural", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Art Museum, 134 Small Auditorium", "category": "", "url": "https://www.princeton.edu/events/2026/performance-and-contradiction-acting-natural", "register": "", "audience": "Open to the Public, Faculty & Academic Professionals, Staff, Students, Alumni", "description": "In the 1970s, performance gained widespread purchase as a discrete artistic category and lens of scholarly analysis in the United States. At the same time, its discourses were mired in irresolution. This talk argues that these twinned phenomena issue from performance’s formal capacity to register contradictions at the level of political economy. I take artists as among the first and best theorists"}, {"title": "PPS Lab Mixer", "source": "university", "start": "2026-10-01T16:30:00-04:00", "end": "2026-10-01T17:30:00-04:00", "allday": false, "location": "Princeton Neuroscience Institute, A00B", "category": "", "url": "https://www.princeton.edu/events/2026/pps-lab-mixer", "register": "", "audience": "Faculty & Academic Professionals, Staff, Students", "description": "Provide a low-stakes environment for undergrads to chat with psych department members about their work/current projects. This could give undergrads a chance to hear about research that may interest them for their future independent work. Additionally this event will offer department members the opportunity to engage in mentorship and/or identify prospective RAs for their labs. Dinner will be provi"}, {"title": "Upstream, Downstream, Offshore: Constancy Amidst the Flux of Supply Chains", "source": "university", "start": "2026-10-01T16:30:00-04: const SRC = Object.fromEntries(DATA.sources.map(s => [s.key, s]));
const EV = DATA.events.map(e => ({...e, d: new Date(e.start), e2: new Date(e.end)}));
const on = new Set(DATA.sources.map(s => s.key));
const chips = document.getElementById('chips');
DATA.sources.forEach(s => {
  const c = document.createElement('button');
  c.className = 'chip on'; c.style.setProperty('--dot', s.color);
  const n = EV.filter(e => e.source === s.key).length;
  c.innerHTML = `<span class="dot"></span>${s.label}<span class="n">${n}</span>`;
  c.onclick = () => { c.classList.toggle('on'); on.has(s.key) ? on.delete(s.key) : on.add(s.key); render(); };
  chips.appendChild(c);
});
const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
document.getElementById('dows').innerHTML = dows.map(d => `<div class="dow">${d}</div>`).join('');
let view = new URLSearchParams(location.search).get('view') === 'list' ? 'list' : 'month';
let cursor = new Date(Date.now());
const fmtT = d => d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(':00','');
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const vis = () => EV.filter(e => on.has(e.source));

function render(){
  const ev = vis();
  document.getElementById('sub').textContent =
    `${ev.length} upcoming events · ${DATA.sources.length} sources · refreshed ${DATA.generated_label}`;
  document.getElementById('foot').textContent =
    'Scraped from chapel / career development / campus rec / university events. Toggles filter this page only.';
  document.getElementById('month').style.display = view === 'month' ? '' : 'none';
  document.getElementById('list').style.display = view === 'list' ? '' : 'none';
  document.getElementById('bMonth').className = view === 'month' ? 'on' : '';
  document.getElementById('bList').className = view === 'list' ? 'on' : '';
  view === 'month' ? renderMonth(ev) : renderList(ev);
}
function renderMonth(ev){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('mtitle').textContent =
    cursor.toLocaleDateString([], {month:'long', year:'numeric'});
  const first = new Date(y, m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = new Date(); let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dayEv = ev.filter(e => {
      const a = new Date(e.d.getFullYear(), e.d.getMonth(), e.d.getDate());
      const b = new Date(e.e2.getFullYear(), e.e2.getMonth(), e.e2.getDate());
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return t >= a && t <= (e.allday ? new Date(b - 86400000) : b);
    }).sort((a,b) => a.d - b.d);
    const cls = 'day' + (d.getMonth() !== m ? ' out' : '') + (sameDay(d, today) ? ' today' : '');
    html += `<div class="${cls}"><div class="dnum"><span>${d.getDate()}</span></div>`;
    dayEv.slice(0,4).forEach(e => {
      const col = SRC[e.source] ? SRC[e.source].color : '#888';
      html += `<a class="ev${e.allday?' all':''}" style="--dot:${col}" href="${e.url}" target="_blank"
        title="${e.title.replace(/"/g,'&quot;')}${e.location ? ' — ' + e.location : ''}">
        <span class="tm">${e.allday ? 'all day' : fmtT(e.d)}</span>${e.title.slice(0,58)}</a>`;
    });
    if (dayEv.length > 4) html += `<div class="tm" style="color:var(--muted);font-size:10.5px">+${dayEv.length-4} more</div>`;
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}
function renderList(ev){
  const groups = {};
  ev.forEach(e => { const k = e.d.toDateString(); (groups[k] = groups[k] || []).push(e); });
  const keys = Object.keys(groups).sort((a,b) => new Date(a) - new Date(b)).slice(0, 45);
  if (!keys.length){ document.getElementById('list').innerHTML = '<div class="empty">Nothing ahead for the selected sources.</div>'; return; }
  document.getElementById('list').innerHTML = keys.map(k => {
    const d = new Date(k);
    const rows = groups[k].sort((a,b) => a.d - b.d).map(e => {
      const col = SRC[e.source] ? SRC[e.source].color : '#888';
      const lbl = SRC[e.source] ? SRC[e.source].label : e.source;
      const time = e.allday ? 'All day' : fmtT(e.d) + (e.end !== e.start ? ' – ' + fmtT(e.e2) : '');
      const meta = [e.location, e.audience].filter(Boolean).join(' · ');
      const desc = (e.description || '').slice(0, 190);
      return `<div class="row"><div class="time">${time}</div><div class="body">
        <a href="${e.url}" target="_blank">${e.title}</a>
        ${meta ? `<div class="meta">${meta}</div>` : ''}
        ${desc ? `<div class="desc">${desc}${(e.description || '').length > 190 ? '…' : ''}</div>` : ''}
        <div class="chips"><span class="src" style="--dot:${col}">${lbl}</span>
          <a class="src reg" href="${e.url}" target="_blank">event page</a>
          ${e.register ? `<a class="src reg" href="${e.register}" target="_blank">register</a>` : ''}
        </div>
      </div></div>`;
    }).join('');
    return `<div class="daygroup"><h3>${d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})}</h3>${rows}</div>`;
  }).join('');
}
document.getElementById('prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
document.getElementById('next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };
document.getElementById('today').onclick = () => { cursor = new Date(); render(); };
document.getElementById('bMonth').onclick = () => { view = 'month'; render(); };
document.getElementById('bList').onclick = () => { view = 'list'; render(); };
render();
</script>
